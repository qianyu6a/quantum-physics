<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量子物理交互科普 | 从紫外灾难到标准模型</title>
<style>
:root {
  --bg: #080c14; --surface: #0f1624; --surface2: #141e30;
  --border: rgba(0,180,216,0.12); --accent: #00b4d8; --accent2: #7209b7;
  --fg: #e0e8f0; --muted: #8899aa; --faint: #3a4a60;
  --pink: #f72585; --gold: #f4a261; --green: #2ec4b6;
  --radius: 10px; --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:var(--font); height:100vh; display:flex; overflow:hidden; }

/* Sidebar */
.sidebar {
  width:260px; min-width:260px; background:var(--surface);
  border-right:1px solid var(--border); display:flex; flex-direction:column;
  overflow-y:auto; z-index:10;
}
.sidebar-header {
  padding:20px 16px 12px; border-bottom:1px solid var(--border);
  background:linear-gradient(180deg, rgba(0,180,216,0.05) 0%, transparent 100%);
}
.sidebar-header h1 { font-size:15px; color:var(--accent); letter-spacing:1px; }
.sidebar-header p { font-size:10px; color:var(--muted); margin-top:4px; }
.tree { padding:4px 0; }
.tree-node { user-select:none; }
.tree-label {
  display:flex; align-items:center; gap:8px; padding:8px 16px;
  cursor:pointer; font-size:13px; color:var(--fg); transition:all .15s;
  border-left:2px solid transparent;
}
.tree-label:hover { background:var(--surface2); }
.tree-label.active {
  background:var(--surface2); border-left:2px solid var(--accent);
  color:var(--accent);
}
.tree-label .icon { font-size:11px; width:16px; text-align:center; flex-shrink:0; }
.tree-label .num {
  font-size:10px; color:var(--faint); min-width:18px; text-align:right;
}
.tree-label.active .num { color:var(--accent); }

/* Content */
.content {
  flex:1; overflow-y:auto; padding:36px 44px 60px;
  scroll-behavior:smooth;
}
.content::-webkit-scrollbar { width:5px; }
.content::-webkit-scrollbar-track { background:transparent; }
.content::-webkit-scrollbar-thumb { background:var(--faint); border-radius:3px; }

.section { display:none; animation:fadeIn .3s ease; }
.section.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

.section-header { margin-bottom:24px; }
.section-header h2 { font-size:26px; color:var(--fg); margin-bottom:4px; }
.section-header .year { font-size:12px; color:var(--accent); letter-spacing:2px; }
.section-header .tagline { font-size:13px; color:var(--muted); margin-top:6px; line-height:1.6; }

/* Concept card */
.concept-block { margin:24px 0; }
.concept-block h3 { font-size:15px; color:var(--accent); margin-bottom:8px; }
.concept-block p { font-size:14px; line-height:1.8; color:var(--muted); margin-bottom:10px; }
.concept-block .highlight { color:var(--fg); font-weight:500; }

.callout {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 20px; margin:16px 0; font-size:13px; line-height:1.7;
}
.callout.accent { border-left:3px solid var(--accent); }
.callout.purple { border-left:3px solid var(--accent2); }
.callout.gold { border-left:3px solid var(--gold); }
.callout.green { border-left:3px solid var(--green); }

/* Canvas container */
.canvas-container {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  margin:20px 0; overflow:hidden; position:relative;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
.canvas-container canvas { display:block; width:100%; }
.canvas-container .canvas-label {
  position:absolute; top:10px; right:14px; font-size:10px;
  color:var(--faint); letter-spacing:1px;
}
.canvas-container .canvas-hint {
  position:absolute; bottom:10px; left:14px; font-size:10px;
  color:var(--faint); opacity:0.7; pointer-events:none;
}

/* Control Panel */
.controls {
  display:flex; flex-wrap:wrap; gap:12px; padding:12px 16px;
  background:var(--surface2); border-top:1px solid var(--border);
  align-items:center;
}
.controls label { font-size:11px; color:var(--muted); white-space:nowrap; }
.controls input[type="range"] {
  -webkit-appearance:none; appearance:none; height:4px;
  background:var(--faint); border-radius:2px; outline:none; cursor:pointer;
  width:100px;
}
.controls input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none; width:16px; height:16px;
  border-radius:50%; background:var(--accent); cursor:pointer;
  box-shadow:0 0 8px rgba(0,180,216,0.4);
}
.controls .btn {
  padding:5px 14px; border-radius:14px; border:1px solid var(--accent);
  background:transparent; color:var(--accent); font-size:11px; cursor:pointer;
  transition:all .2s; font-family:var(--font);
}
.controls .btn:hover { background:rgba(0,180,216,0.15); }
.controls .btn:active { transform:scale(0.95); }
.controls .val { font-size:11px; color:var(--accent); min-width:30px; }
@media (max-width:768px) {
  .controls { gap:8px; padding:10px 12px; }
  .controls input[type="range"] { width:70px; }
}

/* Tags */
.tag-row { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
.tag {
  font-size:10px; padding:3px 10px; border-radius:12px; letter-spacing:0.5px; font-weight:600;
}
.tag.root { background:rgba(0,180,216,0.15); color:var(--accent); }
.tag.quantum { background:rgba(247,37,133,0.15); color:var(--pink); }

/* Back to top */
.back-top {
  position:fixed; bottom:24px; right:24px; z-index:100;
  width:40px; height:40px; border-radius:50%; background:var(--accent);
  color:var(--bg); border:none; font-size:18px; cursor:pointer;
  opacity:0; transform:translateY(10px); transition:all .3s;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 20px rgba(0,180,216,0.3);
}
.back-top.visible { opacity:1; transform:translateY(0); }
.back-top:hover { transform:scale(1.1); }

/* Mobile */
@media (max-width:768px) {
  body { flex-direction:column; }
  .sidebar {
    width:100%; min-width:100%; max-height:50px; overflow:hidden;
    border-right:none; border-bottom:1px solid var(--border);
    transition:max-height .3s;
  }
  .sidebar.open { max-height:60vh; overflow-y:auto; }
  .sidebar-header { padding:12px 16px 8px; cursor:pointer; }
  .sidebar-header::after { content:' ☰'; font-size:14px; color:var(--accent); float:right; }
  .content { padding:20px 16px 40px; }
  .section-header h2 { font-size:21px; }
  .back-top { bottom:16px; right:16px; }
}

/* ══ Light Theme ══ */
body.light { --bg: #f0f4f8; --surface: #ffffff; --surface2: #e8ecf1; --fg: #1a1a2e; --muted: #555; --faint: #bbb; --border: rgba(0,0,0,0.1); }
body.light .sidebar { background: var(--surface); }
body.light .controls { background: var(--surface2); }
body.light .callout { background: var(--surface); }
body.light .canvas-container { background: var(--surface); }

/* ══ Top Nav Bar ══ */
.topnav {
  position:fixed; top:0; left:0; right:0; z-index:100; height:44px;
  background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 16px;
  backdrop-filter:blur(10px);
}
.topnav .logo { font-size:14px; color:var(--accent); font-weight:700; cursor:pointer; letter-spacing:1px; }
.topnav .nav-btns { display:flex; gap:8px; align-items:center; }
.topnav .nav-btn {
  padding:4px 10px; border-radius:6px; border:1px solid var(--border);
  background:transparent; color:var(--muted); font-size:11px; cursor:pointer;
  font-family:var(--font); transition:all .2s;
}
.topnav .nav-btn:hover { border-color:var(--accent); color:var(--accent); }
.topnav .nav-btn.active { background:rgba(0,180,216,0.15); border-color:var(--accent); color:var(--accent); }

/* ══ Home View ══ */
#home-view { padding-top:44px; display:none; }
#home-view.active { display:block; height:calc(100vh - 44px); overflow-y:auto; }
.home-hero {
  text-align:center; padding:60px 20px 40px;
  background:linear-gradient(180deg, rgba(0,180,216,0.08) 0%, transparent 100%);
}
.home-hero h1 { font-size:32px; color:var(--fg); margin-bottom:8px; }
.home-hero .subtitle { font-size:14px; color:var(--muted); max-width:600px; margin:0 auto; line-height:1.8; }
.home-hero .stats { display:flex; justify-content:center; gap:32px; margin-top:24px; }
.home-hero .stat { text-align:center; }
.home-hero .stat-num { font-size:28px; font-weight:700; color:var(--accent); }
.home-hero .stat-label { font-size:10px; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }

/* Timeline */
.timeline-section { padding:32px 20px; max-width:800px; margin:0 auto; }
.timeline-section h2 { font-size:18px; color:var(--accent); margin-bottom:20px; text-align:center; }
.timeline { position:relative; padding-left:24px; border-left:2px solid var(--border); }
.timeline-item { margin-bottom:24px; position:relative; }
.timeline-item::before {
  content:''; position:absolute; left:-30px; top:4px; width:10px; height:10px;
  border-radius:50%; background:var(--accent); border:2px solid var(--surface);
}
.timeline-year { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:1px; }
.timeline-text { font-size:13px; color:var(--muted); line-height:1.7; margin-top:4px; }

/* Concept Cards Grid */
.cards-section { padding:20px; max-width:1000px; margin:0 auto; }
.cards-section h2 { font-size:18px; color:var(--accent); margin-bottom:16px; text-align:center; }
.search-bar {
  display:flex; justify-content:center; margin-bottom:20px;
}
.search-bar input {
  background:var(--surface2); border:1px solid var(--border); border-radius:20px;
  padding:8px 20px; color:var(--fg); font-size:13px; width:280px; max-width:90%;
  outline:none; font-family:var(--font);
}
.search-bar input:focus { border-color:var(--accent); }
.cards-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
.concept-card {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; cursor:pointer; transition:all .2s;
}
.concept-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 20px rgba(0,180,216,0.1); }
.concept-card .card-icon { font-size:24px; margin-bottom:8px; }
.concept-card .card-num { font-size:10px; color:var(--faint); letter-spacing:1px; }
.concept-card .card-title { font-size:15px; color:var(--fg); margin:4px 0; font-weight:600; }
.concept-card .card-desc { font-size:12px; color:var(--muted); line-height:1.6; }
.concept-card.hidden { display:none; }

/* ══ Detail View ══ */
#detail-view { padding-top:44px; display:none; min-height:100vh; }
#detail-view.active { display:flex; height:100vh; overflow:hidden; }
.no-results { text-align:center; color:var(--muted); padding:40px; font-size:14px; display:none; }

/* Mobile topnav */
@media (max-width:768px) {
  body { overflow-y:auto; overflow-x:hidden; }
  #home-view.active { height:auto; overflow-y:visible; }
  .home-hero h1 { font-size:24px; }
  .cards-grid { grid-template-columns:1fr; }
  .timeline-section { padding:20px 12px; }
  #detail-view.active { flex-direction:column; height:100vh; overflow:hidden; }
  #detail-view.active .sidebar { width:100%; min-width:100%; max-height:50px; overflow:hidden; }
  #detail-view.active .content { flex:1; overflow-y:auto; }
}

</style>
</head>
<body>

  <div class="topnav">
    <span class="logo" onclick="showView('home')">⚛️ 量子物理</span>
    <div class="nav-btns">
      <button class="nav-btn active" id="navHome" onclick="showView('home')">🏠 首页</button>
      <button class="nav-btn" id="navDetail" onclick="showView('detail')">📚 知识库</button>

        <div class="stat"><div class="stat-num">15</div><div class="stat-label">核心概念</div></div>

        <div class="stat"><div class="stat-num">17</div><div class="stat-label">基本粒子</div></div>
      </div>
    </div>
    
    <div class="timeline-section">
      <h2>📜 近代物理编年史</h2>

<!-- Sidebar -->
<div id="detail-view">
<nav class="sidebar" id="sidebar">

  </div>
  <div class="tree" id="tree"></div>
</nav>

<!-- Content -->

<script>
// ═══════════════════════════════════════
// Data: 15 Quantum Concepts
// ═══════════════════════════════════════
const concepts = [
  { id:'planck', num:1, title:'能量量子化', year:'1900 普朗克', icon:'🔸', tag:'root',
    tagline:'能量不是连续的，是一份一份的。这是量子物理的开端。',
    problem:'1900年的物理学界笼罩在一片乐观之中——开尔文勋爵宣称"物理学的大厦已经建成"，只剩下"两朵乌云"。其中一朵就是黑体辐射：为什么加热的铁块会先发红、后发白？经典理论算出来的能量分布，在紫外线波段会趋向无穷大——这就是著名的"紫外灾难"。42岁的马克斯·普朗克，一个保守的德国物理学家，花了六年时间试图用经典热力学解决这个问题，却屡屡碰壁。最后他做了一个连自己都觉得"绝望"的假设。',
    insight:'1900年10月7日，普朗克在绝望中假设：物质发射和吸收辐射时，能量不是连续的，而是一份一份的"量子"，最小单位E = hν。这个常数h后来成为整个量子力学的基石。但普朗克自己把它叫做"纯粹形式的假设"，之后多年试图回到经典框架里消除它，却一次次失败。他后来回忆："我的徒劳无功使我愈加坚信，作用量子在原子物理中扮演着根本性的角色。"这一天现在被公认为量子物理的诞生日。',
    bigpic:'就像能量是一级一级的楼梯，你不能站在半级台阶上。日常世界中能量看起来连续，只是因为h太小了，台阶密到你完全感觉不到。但从那天起，物理学被劈成了两半——经典世界和量子世界。普朗克打开了一扇他自己都不敢走进去的门，但他获得的1918年诺贝尔奖，标志着人类开始重新理解宇宙的基本规则。',
    canvasId:'canvas-planck' },

  { id:'photoelectric', num:2, title:'光量子 · 光电效应', year:'1905 爱因斯坦', icon:'💡', tag:'root',
    tagline:'光不是连续的波，是一颗一颗的粒子——光子。',
    problem:'1887年，赫兹在做电磁波实验时无意中发现：紫外线照在金属上会打出电子。更诡异的是，打不打得出来取决于光的颜色而不是亮度——红光再亮也打不出电子，紫光再弱也能打出来。经典波动理论认为光越亮能量越大，这个现象完全无法解释。1905年，一个在瑞士专利局工作的26岁年轻人，利用业余时间写了四篇改变世界的论文——其中一篇就解决了光电效应。',
    insight:'爱因斯坦提出一个大胆的想法：光不是连续的波，而是一颗一颗的"光量子"（后来叫光子），每颗能量E = hν。电子要脱离金属表面，需要光子提供足够威力——这取决于频率而不是亮度。频率不够，你再亮也没用；频率够了，再微弱的光也能打出电子。最具戏剧性的是：美国物理学家密立根花了整整十年做实验，一心想推翻爱因斯坦的理论，结果实验数据反而完美证实了它。密立根在论文里承认"爱因斯坦的光电方程准确无误"——然后两人分别获得了诺贝尔奖。',
    bigpic:'就像用乒乓球砸玻璃——扔一万个也砸不碎，但一颗子弹就够了。E = hν意味着频率决定单颗光子的威力。这篇论文加上狭义相对论和布朗运动，被后人称为爱因斯坦的"奇迹年"。光电效应不仅证实了光的粒子性，更让人们不得不接受"量子"这个诡异的概念——光是粒子还是波？答案居然是"都是"。这个矛盾直接导致了波粒二象性的诞生。',
    canvasId:'canvas-photoelectric' },

  { id:'bohr', num:3, title:'原子轨道量子化', year:'1913 玻尔', icon:'🪐', tag:'root',
    tagline:'电子只能住在特定的"楼层"，不能待在中间地带。',
    problem:'1911年，卢瑟福用α粒子轰击金箔，发现原子里面竟然有一个极小但极重的核。按经典电磁学，电子绕核旋转应该不断辐射能量，在不到1微秒内坠毁在核上——但原子是稳定的。这个世界不应该存在。年轻的丹麦物理学家尼尔斯·玻尔来到卢瑟福实验室，看到这个矛盾后，灵光一闪。',
    insight:'玻尔在1913年做了一个"混合怪兽"式的假设：电子只能待在特定的"允许轨道"上，不辐射能量；只有当它从一个轨道"跳"到另一个轨道时，才吸收或放出一个光子。这让氢原子的所有光谱线被精确计算出来——与实验数据吻合到震惊的程度。玻尔模型是"半经典半量子"的：轨道是经典的，跃迁是量子的。玻尔自己后来成了哥本哈根量子力学的"教父"，他的研究所吸引了海森堡、泡利等一代天才。',
    bigpic:'电子住楼房——1楼、2楼、3楼，没有1.5楼。跃迁是瞬时的，不经过中间。玻尔模型解释了为什么每种元素有独特的"指纹"（光谱线），让化学有了物理基础。虽然它后来被量子力学取代，但那个"电子在轨道上跳来跳去"的画面依然是我们对原子的最直观理解。',
    canvasId:'canvas-bohr' },

  { id:'debroglie', num:4, title:'波粒二象性', year:'1924 德布罗意', icon:'🌊', tag:'root',
    tagline:'所有物质都有波的属性——包括你。',
    problem:'1923年，一个法国贵族家庭的年轻人提交了一篇博士论文——他本来是学历史的，觉得物理学"更好玩"就转了行。路易·德布罗意在论文中提出了一个在当时看来近乎荒诞的问题：既然光（波）被证明有粒子性，那电子（粒子）为什么不能有波动性？这不是异想天开，而是基于对对称性的深刻信念——大自然不会只让光享受"波粒双重身份"。',
    insight:'德布罗意给出了一个极其简洁的公式：λ = h / p，每个粒子的波长等于普朗克常数除以动量。你的波长只有10⁻³⁶米——比原子核还小万亿倍。但电子的波长刚好和原子间距相当——这解释了为什么玻尔的轨道只能是特定的：刚好排满整数个波长的轨道才能稳定存在。评审委员会觉得这想法太疯狂，拿去问爱因斯坦。爱因斯坦说："他揭开了大幕的一角。"1927年实验证实电子确实会产生干涉条纹——德布罗意仅凭一篇博士论文就拿了1929年的诺贝尔物理学奖，空前绝后。',
    bigpic:'如果电子是波，那质子、中子呢？——都是。如果所有物质都是波，那整个世界本质上是一首波动交响曲。粒子在空间中不是点，而是一团扩散的概率云雾。这个想法直接催生了薛定谔的波动力学。德布罗意的洞见在于：他不是发现了什么新现象，而是把一个已知原理推广到了所有物质——这就是理论物理的最高境界。',
    canvasId:'canvas-debroglie' },

  { id:'uncertainty', num:5, title:'不确定性原理', year:'1927 海森堡', icon:'🎲', tag:'root',
    tagline:'你不可能同时精确知道一个粒子的位置和速度。这不是测量技术的问题，是自然界的底层规律。',
    problem:'1927年冬天，哥本哈根。25岁的沃纳·海森堡一个人在公园里踱步到深夜。他在想一个问题：在量子理论中，你观察一个电子，就必须用光子去"照"它——但光子一撞上去，电子的速度就变了。你越想看清楚它的位置，对它的速度扰动就越大。这到底是测量技术的限制，还是更根本的东西？海森堡意识到，这比他想得更深。',
    insight:'海森堡得出的结论石破天惊：不确定不是因为我们测量不够好，而是因为粒子本身就没有"确定的位置和速度"这回事。Δx·Δp ≥ ℏ/2是自然界的硬性定律，不是技术问题。爱因斯坦恨透了这个结论，他著名的反驳"上帝不掷骰子"就是针对这种概率性。玻尔后来把它升级为"互补原理"——位置和动量是互补的，知道一个就失去另一个。两人在1927年的索尔维会议上展开了物理学史上最精彩的哲学辩论，爱因斯坦每次都试图设计思想实验推翻不确定性，玻尔每次都用爱因斯坦自己的广义相对论来反驳。',
    bigpic:'就像拍照：快门越快，运动模糊越大。但不确定性原理不是说"我们不知道"——而是说"自然本身就只承诺概率分布"。你在测量之前问"电子到底在哪儿"，这个问题在量子力学里是没有意义的——它不是藏起来了，是根本还没决定。这个哲学冲击比物理学本身还要大。',
    canvasId:'canvas-uncertainty' },

  { id:'schrodinger', num:6, title:'薛定谔方程', year:'1926 薛定谔', icon:'📐', tag:'root',
    tagline:'量子力学的"牛顿第二定律"——描述量子态如何随时间演化。',
    problem:'1925年，海森堡发明了"矩阵力学"来描述量子现象，但充满了抽象难懂的矩阵运算，大多数物理学家看不懂。第二年，奥地利的埃尔温·薛定谔受德布罗意波粒二象性的启发，想找到一种更直观的数学语言。据说他带着情人去阿尔卑斯山度假，回来后就写出了那个著名的方程。',
    insight:'薛定谔方程 iℏ ∂ψ/∂t = Ĥψ 是量子力学的"牛顿第二定律"——描述量子态如何随时间演化。方程的主角是波函数ψ，它本身看不到摸不着，但|ψ|²告诉你在某个位置找到粒子的概率。薛定谔用它精确算出了氢原子的所有能级——和海森堡的矩阵力学结果完全一致，但优雅得多。最具讽刺的是：薛定谔后来成了量子力学的"反对者"！他提出的"薛定谔的猫"思想实验——一只同时既死又活的猫——本意是想嘲笑量子力学的荒谬，结果反而成了量子力学最著名的比喻。',
    bigpic:'牛顿力学告诉你：球下一秒在(x, y, z)。量子力学说：球下一秒在(x, y, z)的概率是63%。不是因为我们不知道——是自然本身只承诺了概率。薛定谔方程优雅到让人窒息，但它的哲学含义至今仍是物理学最深刻的谜题。那只既死又活的猫，成了流行文化中"量子"的代名词。',
    canvasId:'canvas-schrodinger' },

  { id:'dirac', num:7, title:'狄拉克方程 · 反物质', year:'1928 狄拉克', icon:'🪞', tag:'root',
    tagline:'一个方程里藏着一个镜像世界——预言了反物质的存在。',
    problem:'1928年，保罗·狄拉克面临一个艰巨的挑战：薛定谔方程不兼容狭义相对论。如果一个电子以接近光速运动，薛定谔方程算出来的结果就是错的。狄拉克想要一个同时满足量子力学和相对论的方程——这就像要求一个句子同时押韵、对仗、平仄，在物理上几乎是不可能的事。',
    insight:'狄拉克做到了。他写出了方程，一个美到令人窒息的公式。但解出来的结果很奇怪：有一半解对应"负能量"，物理上似乎没意义。当时所有物理学家都想扔掉这些解，狄拉克却说：等等，这不是bug，这是预言。他提出：存在一种与电子质量相同但电荷相反的反粒子——正电子。1932年，卡尔·安德森在宇宙射线实验中真的发现了正电子。一个方程预言了一个从未被观察到的东西，然后在实验室里被找到——这是理论物理的最高荣耀。',
    bigpic:'狄拉克方程就像一面镜子：每种粒子都有反粒子。电子↔正电子，质子↔反质子。当它们相遇，100%的质量转化为能量——E=mc²的终极实现。这个发现的意义超越了物理学：它证明数学的美可以指引我们找到物理的真理。狄拉克说："让方程变美比让方程拟合实验更重要。"杨振宁后来评价："狄拉克的文章是秋水文章不染尘。"',
    canvasId:'canvas-dirac' },

  { id:'qft', num:8, title:'量子场论 · QFT', year:'1930s-1950s', icon:'🌀', tag:'quantum',
    tagline:'场才是根本，粒子只是场的涟漪。你看的每一个电子，都是同一个电子场的不同波浪。',
    problem:'1930年代，物理学家试图用量子力学描述电磁场，遇到了巨大的麻烦：按照理论，真空中可以不断产生和湮灭虚粒子对，导致计算出来的电子自能变成无穷大。这个问题几乎让量子场论胎死腹中。二战结束后，三位天才几乎同时找到了解决办法——他们把无穷大巧妙地"藏起来"了。',
    insight:'量子场论的革命性视角是：场才是根本的，粒子只是场的涟漪。你的电子和月球上的电子，是同一个"电子场"的不同波浪。就像湖面上泛起的波纹——你没有看到独立的"水块"，你看到的是水的运动。费曼发明了图解法、施温格擅长数学推导、朝永振一郎独立完成了日本版本——三人殊途同归，完成了"重整化"。结果让电子磁矩的理论值和实验值吻合到小数点后12位——相当于测量地球直径误差不超过一根头发丝。',
    bigpic:'量子场论告诉我们：真空不是空的——它是所有场的基态，不断有虚粒子在极短时间内"借能量"产生又湮灭。你每吸一口气，里面都有光子在其中产生和消失。QFT的成功如此之大，以至于它成为所有现代粒子物理的基础框架。标准模型就是QFT的一个具体实现。',
    canvasId:'canvas-qft' },

  { id:'feynman', num:9, title:'费曼图 · QED', year:'1940s 费曼', icon:'📊', tag:'quantum',
    tagline:'人类历史上最精确的物理理论——精确到小数点后12位。',
    problem:'量子电动力学的理论计算涉及无穷多个可能的中间过程。假设你要算两个电子碰一下会怎样——它们可以交换一个光子，也可以交换两个、三个……每个中间过程都对应一个复杂到令人绝望的积分。1940年代，理查德·费曼在康奈尔大学的酒吧里，用鸡尾酒餐巾纸画出了一套图形语言。',
    insight:'费曼图的核心洞见是：每个图对应一个精确的数学表达式。直线代表电子，波浪线代表光子，顶点代表相互作用。你画出一个图，按照规则写出式子，积分——就得到了这个过程发生的概率。两束光照到一起时，光子之间没有直接耦合，但它们可以通过"虚拟"电子-正电子对间接互动——光子先变成一对虚电子，这对虚电子再变回光子。这就是"光的散射"，在经典物理中不可能，在QED中概率极小但非零——费曼图精确预言了这个效应，后来被实验证实。',
    bigpic:'QED预测的电子磁矩与实验测量一致到小数点后12位。这是人类智慧最精确的成就。费曼后来在巴西海滩上一手拿着计算纸一手拿着酒，用费曼图给朋友解释物理——他说：我不在乎诺贝尔奖，我在乎的是这个有趣的世界。',
    canvasId:'canvas-feynman' },

  { id:'standard', num:10, title:'标准模型', year:'1960s-1970s', icon:'🧩', tag:'quantum',
    tagline:'宇宙的"元素周期表"——目前关于物质的最完整答案。',
    problem:'1960年代，粒子加速器像爆米花一样不断发现新的所谓基本粒子——π介子、K介子、各种重子……粒子数量超过100个，物理学家开始怀疑：它们真的是"基本"吗？就像发现了一百多种"基本元素"，你不得不怀疑这背后应该有更少的东西。1964年，默里·盖尔曼和乔治·茨威格各自独立提出：所有的强子都是由更基本的"夸克"组成的。',
    insight:'盖尔曼从詹姆斯·乔伊斯的小说《芬尼根守灵夜》中借来了"夸克"这个名字（小说里海鸥的叫声）。他按照对称性排列已知粒子，发现了美丽的几何图案——"八正法"。就像门捷列夫周期表预言了未知元素，夸克模型预言了Ω⁻粒子——1964年被发现，精准无比。标准模型最终确定了17种基本粒子：6夸克+6轻子+4力载体+1希格斯。所有后续预言的粒子——粲夸克、W/Z玻色子、顶夸克、希格斯——全部被实验找到，最后一个确认的是2012年的希格斯。',
    bigpic:'标准模型是物理学的元素周期表——除了引力，它解释了所有已知的力与物质。但它不完美：没有暗物质、没有暗能量、中微子质量是后加的补丁。它是一座金碧辉煌的殿堂，但窗外还有一个更大的宇宙在敲门。',
    canvasId:'canvas-standard' },

  { id:'higgs', num:11, title:'希格斯机制', year:'1964 / 实验 2012', icon:'🏊', tag:'quantum',
    tagline:'整个宇宙浸泡在希格斯场里——有些粒子穿过它时会"拖泥带水"，这就是质量的来源。',
    problem:'1964年，彼得·希格斯写了论文预言一种新粒子——它能让其他粒子获得质量。他把论文投给《物理快报》，被编辑拒绝了——"和物理学没有明显关联"。希格斯愤怒地加了一段话强调可探测性，转投《物理评论快报》，通过了。但他不知道，另外两组物理学家独立提出了几乎相同的机制。',
    insight:'希格斯机制说：整个宇宙浸泡在一种看不见的"场"里——希格斯场。不同粒子穿过它时受到不同的"阻力"——这就是质量的来源。光子不与希格斯场耦合，所以无质量。顶夸克耦合最强，重达173 GeV。W和Z玻色子因耦合获得质量，完美验证了理论。2012年7月4日，CERN宣布发现了希格斯玻色子。83岁的希格斯在发布会上泪流满面："我从未想过在有生之年能看到这一天。"他等了48年。',
    bigpic:'2013年，希格斯和恩格勒分享了诺贝尔奖。他当天"战略性"地离开了家，去酒吧喝啤酒，避免被记者围堵——他一生厌恶聚光灯。希格斯机制的发现填补了标准模型的最后一块拼图，它告诉我们质量的本质不是东西重，而是和希格斯场的互动程度。',
    canvasId:'canvas-higgs' },

  { id:'entanglement', num:12, title:'量子纠缠 · 贝尔不等式', year:'1935 / 实验 1980s', icon:'🔗', tag:'quantum',
    tagline:'两个纠缠粒子不管隔多远——测一个瞬间影响另一个。爱因斯坦说这不科学，结果他错了。',
    problem:'1935年，爱因斯坦和两个年轻同事写了一篇论文，试图给量子力学"判死刑"。他们设计了EPR佯谬：两个纠缠粒子分开后，测一个瞬间知道另一个的状态——这违反了相对论的信息不能超光速。爱因斯坦称之为"鬼魅般的超距作用"，坚信量子力学不完整。所有人都觉得爱因斯坦是对的——他是爱因斯坦啊。直到1964年，一个叫约翰·贝尔的爱尔兰物理学家决定检验这件事。',
    insight:'贝尔本来支持爱因斯坦的观点，想证明量子力学错了。他推导出一个不等式：如果存在隐藏变量，实验结果必须满足它。然后他发现量子力学的预测会违反这个不等式。这意味着：要么接受超光速，要么接受粒子在测量前确实没有确定的值。1982年，法国物理学家阿兰·阿斯佩做了完美实验——结果贝尔不等式被明确违反。爱因斯坦错了。量子纠缠是真的"鬼魅"。',
    bigpic:'不是它们商量好了——而是它们根本没有独立存在过。纠缠粒子共享同一个波函数，就像撕开一张纸，你得到两张纸，但它们本是一体。量子纠缠现在成了量子通信和量子计算的核心资源。贝尔用一个不等式终结了物理学史上最伟大的哲学辩论——爱因斯坦在这件事上错了，但他的质疑精神驱动了整个物理学的前进。',
    canvasId:'canvas-entanglement' },

  { id:'qcd', num:13, title:'量子色动力学 · QCD', year:'1970s', icon:'🎨', tag:'quantum',
    tagline:'夸克被永久禁闭——越狱的代价是立刻生一个新狱友。',
    problem:'1970年代，夸克模型取得了巨大成功，但有一个让人发疯的问题：从来没有人看到过自由的夸克。不管你怎么撞质子，永远看不到孤立的夸克飞出来。戴维·格罗斯、弗兰克·维尔切克和戴维·波利策发现了一个反直觉的现象：强力的行为与电磁力完全相反——距离越近，力越弱；距离越远，力越强！',
    insight:'这个发现叫"渐近自由"——夸克在极近距离时几乎像自由粒子，但如果你把它们拉开，力就像橡皮筋一样越来越紧，直到能量大到从真空中"拽"出一对新的夸克-反夸克对。结果就是：你永远看不到单个夸克——这叫"夸克禁闭"。三人因此获得2004年诺贝尔奖。质子是三个夸克被胶子弹簧绑在一起的动态系统，其质量的98%来自胶子的结合能——E=mc²意味着被绑住的光速粒子储存了巨大的能量。',
    bigpic:'QCD解释了为什么质子的质量远远大于三个夸克质量之和。你身体的重量，主要来自胶子在你体内的质子和中子里的弹性势能。我们都是被量子橡皮筋绑在一起的能量结构。这个美丽而疯狂的理论，完美描述了宇宙中最强的力——强相互作用。',
    canvasId:'canvas-qcd' },

  { id:'string', num:14, title:'弦论', year:'1970s-至今', icon:'🎻', tag:'quantum',
    tagline:'最美的万有理论候选者——所有粒子是同一根弦的不同振动。但没有实验证据。',
    problem:'1960年代末，物理学家发现了一个奇怪的公式，完美描述了某些强子的行为。1970年，南部阳一郎等人意识到——这个公式描述的不是粒子，而是弦的振动！弦论最初是强相互作用的理论，但很快被QCD取代。然而一些物理学家注意到方程里藏着一个自旋为2的无质量粒子——恰好是引力子的性质。',
    insight:'弦论的核心思想：所有基本粒子不是点，而是微小到极致的弦。弦的不同振动模式对应不同粒子——就像吉他弦的不同振动发出不同音符。最神奇的是：方程里自动出现了引力。不需要额外假设——引力就是从弦论中自然涌现的。但代价很高：弦需要10维时空，有10⁵⁰⁰种可能的真空解，而且没有任何实验证据。',
    bigpic:'弦论是美到窒息但可能是错的。它是纯靠数学之美驱动的前沿探索。批评者说这不是科学（没有可证伪的预言），支持者说我们的望远镜还不够大。但弦论已经贡献了改变物理学的数学工具——无论它对错，它已经改变了我们思考宇宙的方式。',
    canvasId:'canvas-string' },

  { id:'quantum-computing', num:15, title:'量子计算', year:'1980s-至今', icon:'💻', tag:'quantum',
    tagline:'经典计算机走迷宫一个一个岔路试，量子计算机所有岔路同时走。',
    problem:'1981年，费曼在MIT做了一场著名的演讲，开场就抛出挑衅：大自然不是经典的！你想用经典计算机模拟量子世界？门都没有，你根本算不动。当时这话听着像科幻——计算机不是越来越快吗？但费曼是对的：模拟哪怕几十个粒子的量子系统，经典计算机需要的资源就会按指数爆炸，宇宙寿命耗尽也算不完。这个"算不动"的难题，成了量子计算的起跑线。',

// ═══════════════════════════════════════
// Canvas Interaction System v2 — Touch + State + Controls
// ═══════════════════════════════════════
const canvases = {};
const canvasStates = {};

// Default state per concept
function defaultState(id) {
  switch(id) {
    case 'planck': return { freq: 5, showClassical: true };
    case 'photoelectric': return { freq: 7, intensity: 50, threshold: 4.5 };
    case 'bohr': return { level: 1, autoJump: true };
    case 'debroglie': return { momentum: 1, showWave: true };
    case 'uncertainty': return { spread: 30, dragging: false, dragX: 0 };
    case 'schrodinger': return { n: 3, wellDepth: 1, timeSpeed: 1 };
    case 'dirac': return { energy: 1.5, showPair: false };
    case 'qft': return { fieldStrength: 1, excitationCount: 5 };
    case 'feynman': return { angle: 90 };
    case 'standard': return { highlightParticle: null };
    case 'higgs': return { couplingStrength: 1 };
    case 'entanglement': return { measured: false, angle: 0 };
    case 'qcd': return { pullStrength: 0, quarks: 3 };
    case 'string': return { mode: 1, amplitude: 20 };
    case 'qc': return { theta: Math.PI/4, phi: 0, gate: null };
    default: return {};
  }
}

function initCanvas(id) {
  const c = concepts.find(x => x.id === id);
  if (!c) return;
  const canvas = document.getElementById(c.canvasId);
  if (!canvas) return;
  
  const container = canvas.parentElement;
  const w = container.clientWidth;
  const h = Math.min(400, w * 0.7);
  canvas.width = w * 2;
  canvas.height = h * 2;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  
  const ctx = canvas.getContext('2d');
  ctx.scale(2, 2);
  
  // Init or reuse state
  if (!canvasStates[id]) canvasStates[id] = defaultState(id);
  const state = canvasStates[id];
  
  // Cancel old animation loop before starting new one
  if (canvases[id] && canvases[id]._raf) {
    cancelAnimationFrame(canvases[id]._raf);
  }
  canvases[id] = { ctx, w, h, canvas, frame: 0, state, _raf: null };
  
  // Build control panel
  buildControls(id, container);
  
  // Touch/mouse events
  canvas.onmousedown = canvas.ontouchstart = e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    handlePress(id, x, y);
  };
  canvas.onmousemove = canvas.ontouchmove = e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    handleMove(id, x, y);
  };
  canvas.onmouseup = canvas.ontouchend = () => handleRelease(id);
  canvas.onmouseleave = () => handleRelease(id);
  
  drawCanvas(id);
}

function buildControls(id, container) {
  // Remove old controls
  const old = container.querySelector('.controls');
  if (old) old.remove();
  
  const s = canvasStates[id];
  if (!s) return;
  
  const div = document.createElement('div');
  div.className = 'controls';
  
  switch(id) {
    case 'photoelectric':
      div.innerHTML = `
        <label>频率 ν</label><input type="range" min="1" max="10" value="${s.freq}" id="ctrl-${id}-freq">
        <span class="val" id="val-${id}-freq">${s.freq}</span>
        <label>强度 I</label><input type="range" min="1" max="100" value="${s.intensity}" id="ctrl-${id}-intensity">
        <span class="val" id="val-${id}-intensity">${s.intensity}</span>
        <span style="font-size:11px;color:var(--muted)">阈值: ${s.threshold}</span>
        <span style="font-size:10px;color:${s.freq>=s.threshold?'var(--green)':'var(--pink)'}" id="ctrl-${id}-status">${s.freq>=s.threshold?'✅ 激发':'❌ 不足'}</span>
      `;
      break;
    case 'bohr':
      div.innerHTML = `
        <label>能级</label><input type="range" min="1" max="4" value="${s.level}" id="ctrl-${id}-level">
        <span class="val" id="val-${id}-level">n=${s.level}</span>
        <button class="btn" id="ctrl-${id}-jump">⚡ 跃迁</button>
      `;
      break;
    case 'uncertainty':
      div.innerHTML = `
        <label>波包宽度 Δx</label><input type="range" min="5" max="60" value="${s.spread}" id="ctrl-${id}-spread">
        <span class="val" id="val-${id}-spread">${s.spread}</span>
        <span style="font-size:10px;color:var(--muted)">Δp ≈ ${(1/s.spread*20).toFixed(1)}</span>
        <span style="font-size:10px;color:var(--accent)">拖拽波形也行</span>
      `;
      break;
    case 'schrodinger':
      div.innerHTML = `
        <label>能级 n</label><input type="range" min="1" max="6" value="${s.n}" id="ctrl-${id}-n">
        <span class="val" id="val-${id}-n">n=${s.n}</span>
        <label>势阱</label><input type="range" min="1" max="3" step="0.5" value="${s.wellDepth}" id="ctrl-${id}-depth">
        <span class="val" id="val-${id}-depth">V₀=${s.wellDepth}</span>
      `;
      break;
    case 'entanglement':
      div.innerHTML = `
        <button class="btn" id="ctrl-${id}-measure">📏 测量</button>
        <button class="btn" id="ctrl-${id}-reset">🔄 重置</button>
        <span style="font-size:11px;color:var(--muted)">${s.measured ? '已坍缩: A='+s.resultA+' B='+s.resultB : '等待测量...'}</span>
      `;
      break;
    case 'qc':
      div.innerHTML = `
        <button class="btn" id="ctrl-${id}-X">X门</button>
        <button class="btn" id="ctrl-${id}-H">H门</button>
        <button class="btn" id="ctrl-${id}-Z">Z门</button>
        <button class="btn" id="ctrl-${id}-reset">🔄 重置</button>
        <span style="font-size:10px;color:var(--muted)">或拖拽球体</span>
      `;
      break;
    case 'planck':
      div.innerHTML = `
        <label>频率 ν</label><input type="range" min="1" max="10" value="${s.freq}" id="ctrl-${id}-freq">
        <span class="val" id="val-${id}-freq">${s.freq}</span>
        <button class="btn" id="ctrl-${id}-toggle">${s.showClassical?'隐藏':'显示'}经典曲线</button>
      `;
      break;
    case 'debroglie':
      div.innerHTML = `
        <label>动量 p</label><input type="range" min="1" max="10" value="${s.momentum}" id="ctrl-${id}-p">
        <span class="val" id="val-${id}-p">${s.momentum}</span>
        <span style="font-size:10px;color:var(--muted)">λ = h/p = ${(1/s.momentum).toFixed(2)}</span>
        <button class="btn" id="ctrl-${id}-fire">🔫 发射粒子</button>
      `;
      break;
    case 'dirac':
      div.innerHTML = `
        <label>光子能量 E</label><input type="range" min="1" max="5" step="0.5" value="${s.energy}" id="ctrl-${id}-energy">
        <span class="val" id="val-${id}-energy">${s.energy} MeV</span>
        <button class="btn" id="ctrl-${id}-pair">⚡ 产生粒子对</button>
        <button class="btn" id="ctrl-${id}-annih">☄️ 湮灭演示</button>
        <span style="font-size:10px;color:var(--muted)">点击画面 = 发射光子</span>
      `;
      break;
    case 'string':
      div.innerHTML = `
        <label>振动模式</label><input type="range" min="1" max="5" value="${s.mode}" id="ctrl-${id}-mode">
        <span class="val" id="val-${id}-mode">n=${s.mode}</span>
        <span style="font-size:10px;color:var(--muted)">${['电子','μ子','τ子','顶夸克','希格斯'][s.mode-1]||'?'}</span>
      `;
      break;
    case 'feynman':
      div.innerHTML = `
        <label>散射角 θ</label><input type="range" min="10" max="170" value="${s.angle}" id="ctrl-${id}-angle">
        <span class="val" id="val-${id}-angle">${s.angle}°</span>
        <button class="btn" id="ctrl-${id}-burst">⚡ 虚光子脉冲</button>
        <span style="font-size:10px;color:var(--muted)">点击画面也可发射</span>
      `;
      break;
    default:

  }
  
  container.appendChild(div);
  
  // Bind controls
  div.querySelectorAll('input[type=range]').forEach(slider => {
    slider.oninput = () => {
      const key = slider.id.replace(`ctrl-${id}-`, '');
      canvasStates[id][key] = parseFloat(slider.value);
      const valEl = document.getElementById(`val-${id}-${key}`);
      if (valEl) valEl.textContent = key==='n'||key==='level' ? `n=${slider.value}` : slider.value;
      if (key==='freq' && id==='photoelectric') {
        const s = document.getElementById(`ctrl-${id}-status`);
        if (s) { s.textContent = parseFloat(slider.value)>=canvasStates[id].threshold ? '✅ 激发':'❌ 不足'; s.style.color = parseFloat(slider.value)>=canvasStates[id].threshold ? 'var(--green)':'var(--pink)'; }
      }
    };
  });
  
  div.querySelectorAll('.btn').forEach(btn => {
    btn.onclick = () => {
      const action = btn.id.replace(`ctrl-${id}-`, '');
      handleButton(id, action);
    };
  });
}

function handlePress(id, x, y) {
  const s = canvasStates[id];
  if (!s) return;
  
  if (id === 'uncertainty') {
    s.dragging = true;
    s.dragX = x;
  }
  if (id === 'qc') {
    // Start dragging Bloch sphere
    s.dragging = true;
    s.dragStart = { x, y, theta: s.theta, phi: s.phi };
  }
  if (id === 'qcd') {
    s.pullStrength = 1;
  }
  if (id === 'debroglie') s.manualFire = true;
  if (id === 'dirac') s.fireNow = 'produce';
  if (id === 'feynman') s.burst = 90;
}

function handleMove(id, x, y) {
  const s = canvasStates[id];
  if (!s || !s.dragging) return;
  
  if (id === 'uncertainty') {
    s.spread = Math.max(5, Math.min(60, Math.abs(x - s.dragX) + 10));
    const slider = document.getElementById(`ctrl-uncertainty-spread`);
    if (slider) slider.value = s.spread;
    const val = document.getElementById(`val-uncertainty-spread`);
    if (val) val.textContent = s.spread;
  }
  if (id === 'qc' && s.dragStart) {
    const dx = x - s.dragStart.x;
    const dy = y - s.dragStart.y;
    s.theta = Math.max(0.01, Math.min(Math.PI-0.01, s.dragStart.theta + dy*0.01));
    s.phi = s.dragStart.phi + dx*0.01;
  }
}

function handleRelease(id) {
  const s = canvasStates[id];
  if (!s) return;
  s.dragging = false;
  if (id === 'qcd') s.pullStrength = 0;
}

function handleButton(id, action) {
  const s = canvasStates[id];
  
  switch(action) {
    case 'jump':
      s.level = s.level >= 4 ? 1 : s.level + 1;
      s.autoJump = false;
      setTimeout(() => s.autoJump = true, 2000);
      break;
    case 'measure':
      if (id === 'entanglement' && !s.measured) {
        s.resultA = Math.random() > 0.5 ? '↑' : '↓';
        s.resultB = s.resultA === '↑' ? '↓' : '↑';
        s.measured = true;
        setTimeout(() => { s.measured = false; buildControls(id, document.getElementById(`sec-${id}`).querySelector('.canvas-container')); }, 3000);
      }
      break;
    case 'reset':
      if (id === 'entanglement') { s.measured = false; s.resultA = null; s.resultB = null; }
      if (id === 'qc') { s.theta = Math.PI/4; s.phi = 0; }
      break;
    case 'X': s.theta = Math.PI - s.theta; s.phi = -s.phi; break;
    case 'Z': s.phi += Math.PI; break;
    case 'H': s.theta = Math.PI/4; s.phi = 0; break;
    case 'pair': s.showPair = true; setTimeout(() => s.showPair = false, 2000); break;
    case 'toggle': s.showClassical = !s.showClassical; break;
    case 'fire': s.fireTime = canvases[id].frame; break;
  }
  
  buildControls(id, document.getElementById(`sec-${id}`).querySelector('.canvas-container'));
}

function drawCanvas(id) {
  const cvs = canvases[id];
  if (!cvs) return;
  cvs.frame++;
  
  const { ctx, w, h, state } = cvs;
  ctx.clearRect(0, 0, w, h);
  
  switch(id) {
    case 'planck': drawPlanck(ctx, w, h, cvs.frame, state); break;
    case 'photoelectric': drawPhotoelectric(ctx, w, h, cvs.frame, state); break;
    case 'bohr': drawBohr(ctx, w, h, cvs.frame, state); break;
    case 'debroglie': drawDeBroglie(ctx, w, h, cvs.frame, state); break;
    case 'uncertainty': drawUncertainty(ctx, w, h, cvs.frame, state); break;
    case 'schrodinger': drawSchrodinger(ctx, w, h, cvs.frame, state); break;
    case 'dirac': drawDirac(ctx, w, h, cvs.frame, state); break;
    case 'qft': drawQFT(ctx, w, h, cvs.frame, state); break;
    case 'feynman': drawFeynman(ctx, w, h, cvs.frame, state); break;
    case 'standard': drawStandard(ctx, w, h, cvs.frame, state); break;
    case 'higgs': drawHiggs(ctx, w, h, cvs.frame, state); break;
    case 'entanglement': drawEntanglement(ctx, w, h, cvs.frame, state); break;
    case 'qcd': drawQCD(ctx, w, h, cvs.frame, state); break;
    case 'string': drawString(ctx, w, h, cvs.frame, state); break;
    case 'qc': drawQC(ctx, w, h, cvs.frame, state); break;
  }
  
  cvs._raf = requestAnimationFrame(() => drawCanvas(id));
}

// Helper: draw text with glow
function glowText(ctx, text, x, y, color, size=13) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.fillStyle = color;
  ctx.font = `${size}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
  ctx.restore();
}

// Helper: gradient line
function gradientLine(ctx, x1, y1, x2, y2, c1, c2) {
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.strokeStyle = g;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

// ═══════════════════════════════════════
// Canvas Drawing Functions
// ═══════════════════════════════════════

function drawPlanck(ctx, w, h, t, st) {
  const cx = w/2, freq = st?.freq || 5;
  
  // Compute Planck curve values first
  const points = [];
  let maxPlanck = 0, maxRJ = 0;
  for (let v = 1; v <= 15; v += 0.2) {
    const rj = v * v;
    const pk = Math.pow(v, 3) / (Math.exp(v/freq) - 1);
    points.push({ v, rj, pk });
    if (rj > maxRJ) maxRJ = rj;
    if (pk > maxPlanck) maxPlanck = pk;
  }
  
  // Scale: Planck peak reaches ~60% of graph height
  const scale = (h * 0.6) / Math.max(maxPlanck, 1);
  const rjScale = (h * 0.6) / Math.max(maxRJ, 1) * 0.4;
  
  // Draw axes
  ctx.strokeStyle = 'rgba(136,153,170,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(w*0.08, h*0.15); ctx.lineTo(w*0.08, h*0.85); ctx.lineTo(w*0.92, h*0.85); ctx.stroke();
  ctx.fillStyle = '#8899aa';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('频率 ν →', w*0.5, h*0.92);
  ctx.fillText('能量密度', w*0.04, h*0.5);
  
  // Classical Rayleigh-Jeans (UV catastrophe!)
  if (st?.showClassical !== false) {
    ctx.strokeStyle = '#f72585';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,3]);
    ctx.shadowColor = '#f72585';
    ctx.shadowBlur = 6;
    ctx.beginPath();
    points.forEach((p, i) => {
      const x = w*0.08 + (p.v/15)*w*0.84;
      const y = h*0.85 - p.rj * rjScale;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
    glowText(ctx, '瑞利-金斯 (紫外发散!)', w*0.68, h*0.2, '#f72585', 10);
  }
  
  // Planck curve
  ctx.strokeStyle = '#00b4d8';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#00b4d8';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  points.forEach((p, i) => {
    const x = w*0.08 + (p.v/15)*w*0.84;
    const y = h*0.85 - p.pk * scale;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Peak marker
  const peakV = freq * 2.82; // Wien's displacement law approximation
  const peakX = w*0.08 + Math.min(peakV/15, 1)*w*0.84;
  const peakY = h*0.85 - Math.pow(peakV,3)/(Math.exp(peakV/freq)-1)*scale;
  ctx.fillStyle = '#f4a261';
  ctx.beginPath(); ctx.arc(peakX, Math.max(h*0.15, peakY), 6, 0, Math.PI*2); ctx.fill();
  
  glowText(ctx, '普朗克: 能量量子化 E=hν', w*0.35, h*0.14, '#00b4d8', 14);
  glowText(ctx, `ν₀ = ${freq}`, w*0.15, h*0.82, '#f4a261', 10);
  glowText(ctx, '峰值 →', peakX - 25, peakY - 12, '#f4a261', 10);
}

function drawPhotoelectric(ctx, w, h, t, st) {
  const cx = w/2;
  const freq = st?.freq || 7;
  const intensity = st?.intensity || 50;
  const threshold = st?.threshold || 4.5;
  const isAbove = freq >= threshold;
  
  // Metal surface
  ctx.fillStyle = '#3a4a60';
  ctx.fillRect(w*0.1, h*0.7, w*0.8, 4);
  glowText(ctx, '金属表面', w*0.25, h*0.66, '#8899aa', 10);
  
  // Incoming photons — size = frequency energy
  const nPhotons = Math.floor(intensity / 10);
  for (let i = 0; i < nPhotons; i++) {
    const py = h*0.25 + i*(h*0.35/nPhotons) + Math.sin(t*0.05 + i)*5;
    const px = w*0.1 + (t*1.5 + i*20) % (w*0.6);
    const energy = freq/threshold;
    ctx.fillStyle = isAbove ? '#7209b7' : '#3a4a60';
    ctx.shadowColor = isAbove ? '#7209b7' : 'transparent';
    ctx.shadowBlur = isAbove ? 10 : 0;
    ctx.beginPath();
    ctx.arc(px, py, 3 + energy, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // Ejected electrons if above threshold
  if (isAbove) {
    for (let i = 0; i < Math.min(nPhotons, 6); i++) {
      const ex = w*0.4 + i*60 + (t*0.8 + i*20) % (w*0.4);
      const ey = h*0.5 + Math.sin(t*0.04 + i)*10;
      ctx.fillStyle = '#f4a261';
      ctx.shadowColor = '#f4a261';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ex, ey, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  
  const status = isAbove ? '✅ 电子被激发!' : '❌ 频率不足';
  glowText(ctx, status, cx, h*0.92, isAbove ? '#2ec4b6' : '#f72585', 14);
  glowText(ctx, `ν=${freq} (阈值=${threshold}) | 强度=${intensity}%`, cx, h*0.08, '#00b4d8', 12);
  glowText(ctx, '光电效应: E = hν — 频率决定能不能打出电子', w*0.6, h*0.15, '#8899aa', 10);
}

function drawBohr(ctx, w, h, t, st) {
  const cx = w/2, cy = h*0.5;
  const radii = [35, 60, 85, 115];
  const colors = ['#00b4d8', '#7209b7', '#f72585', '#f4a261'];
  
  // Nucleus
  ctx.fillStyle = '#f72585';
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Orbits
  radii.forEach((r, i) => {
    ctx.strokeStyle = colors[i];
    ctx.globalAlpha = 0.4;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    
    // Electron
    const angle = t*0.03 + i*1.2;
    const ex = cx + r * Math.cos(angle);
    const ey = cy + r * Math.sin(angle);
    ctx.fillStyle = colors[i];
    ctx.shadowColor = colors[i];
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(ex, ey, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  
  // Photon jump
  const jumpT = (t*0.01 % 1);
  if (jumpT < 0.3) {
    const alpha = 1 - jumpT/0.3;
    ctx.strokeStyle = `rgba(0,180,216,${alpha})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(cx + radii[2]*0.7, cy - radii[2]*0.7);
    ctx.quadraticCurveTo(cx + 70, cy - 90, cx + radii[0]*0.7, cy - radii[0]*0.7);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  
  glowText(ctx, 'n=1', cx + radii[0] + 15, cy - 3, '#00b4d8', 10);
  glowText(ctx, 'n=2', cx + radii[1] + 15, cy - 3, '#7209b7', 10);
  glowText(ctx, 'n=3', cx + radii[2] + 15, cy - 3, '#f72585', 10);
  glowText(ctx, 'n=4', cx + radii[3] + 15, cy - 3, '#f4a261', 10);
  glowText(ctx, '核', cx, cy, '#f72585', 9);
  glowText(ctx, '跃迁释放光子 hν = ΔE', w*0.7, h*0.15, '#00b4d8', 11);
}

function drawDeBroglie(ctx, w, h, t, st) {
  // Initialize screen accumulator on first call
  if (!st.screen) { st.screen = new Array(100).fill(0); st.particles = 0; st.slitSep = st.slitSep || 4; }
  
  const slitY = h * 0.22, screenX = w * 0.75, barrierX = w * 0.3;
  const slit1Y = slitY - st.slitSep * 8, slit2Y = slitY + st.slitSep * 8;
  
  // Fire particles periodically
  if (t % 3 === 0 && st.particles < 600) {
    st.particles++;
    // Each particle goes through a random slit and lands according to interference pattern
    const slit = Math.random() < 0.5 ? slit1Y : slit2Y;
    // Simplified interference: probability peaks at positions where path difference = nλ
    const relWavelength = st.slitSep * 0.15;
    const baseScreenY = h * 0.15 + Math.random() * h * 0.7;
    // Add interference modulation: cos² pattern
    const screenIdx = Math.floor((baseScreenY - h*0.15) / (h*0.7) * 100);
    const normalized = (screenIdx / 100 - 0.5) * 2; // -1 to 1
    const interference = Math.pow(Math.cos(normalized * 8 * st.slitSep), 2);
    // Probabilistic: more likely to land where interference is high
    const adjusted = baseScreenY + (Math.random() - 0.5) * h * 0.3 * (1 - interference);
    const idx = Math.max(0, Math.min(99, Math.floor((adjusted - h*0.15) / (h*0.7) * 100)));
    if (idx >= 0 && idx < 100) st.screen[idx]++;
  }
  
  // Draw barrier with slits
  ctx.fillStyle = '#3a4a60';
  ctx.fillRect(barrierX - 4, 0, 8, slit1Y - 16);
  ctx.fillRect(barrierX - 4, slit1Y + 16, 8, slit2Y - slit1Y - 32);
  ctx.fillRect(barrierX - 4, slit2Y + 16, 8, h - slit2Y - 16);
  
  // Slit labels
  ctx.fillStyle = '#00b4d8';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText('缝 A', barrierX - 10, slit1Y + 4);
  ctx.fillText('缝 B', barrierX - 10, slit2Y + 4);
  
  // Incoming particle
  const px = barrierX - 40 - (t * 2 % 80);
  ctx.fillStyle = '#f72585';
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(px, slitY + Math.sin(t*0.5)*5, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Screen: accumulated hits
  const barW = (screenX - barrierX) * 0.8 / 100;
  const maxHits = Math.max(1, ...st.screen);
  for (let i = 0; i < 100; i++) {
    const alpha = st.screen[i] / maxHits;
    ctx.fillStyle = `rgba(0,180,216,${0.1 + alpha * 0.9})`;
    const x = barrierX + 30 + i * barW;
    const barH = st.screen[i] / maxHits * h * 0.5;
    ctx.fillRect(x, h*0.15 + h*0.7 - barH, barW*0.8, barH);
  }
  
  // "Screen" line
  ctx.strokeStyle = '#4a5a70';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(barrierX + 25, 0);
  ctx.lineTo(barrierX + 25, h);
  ctx.stroke();
  
  glowText(ctx, `粒子数: ${st.particles} | 缝距: ${st.slitSep}`, w*0.5, h*0.12, '#00b4d8', 14);
  glowText(ctx, '双缝干涉 — 一个一个粒子积累出干涉条纹', w*0.5, h*0.92, '#8899aa', 11);
  
  // Reset button hint
  if (st.particles >= 500) glowText(ctx, '点击"发射粒子"重置实验', w*0.5, h*0.82, '#f4a261', 10);
}

function drawUncertainty(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  
  // Use state spread or auto-oscillate
  const spread = st?.spread || 30;
  ctx.fillStyle = 'rgba(0,180,216,0.15)';
  ctx.beginPath();
  for (let x = cx-100; x <= cx+100; x += 2) {
    const gauss = Math.exp(-((x-cx)*(x-cx))/(2*spread*spread));
    const y = cy - gauss * 120;
    if (x === cx-100) ctx.moveTo(x, cy);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(cx+100, cy);
  ctx.closePath();
  ctx.fill();
  
  // Position marker
  ctx.strokeStyle = 'rgba(0,180,216,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,3]);
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx, cy-140);
  ctx.stroke();
  ctx.setLineDash([]);
  
  glowText(ctx, `Δx · Δp ≥ ℏ/2`, cx, h*0.12, '#00b4d8', 18);
  glowText(ctx, '位置越确定 → 速度越不确定', cx, h*0.2, '#8899aa', 12);
  glowText(ctx, `位置不确定度: ~${spread.toFixed(0)}`, cx+120, h*0.45, '#00b4d8', 10);
}

function drawSchrodinger(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  const n = st?.n || 3;
  ctx.strokeStyle = '#3a4a60';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(w*0.15, h*0.85);
  ctx.lineTo(w*0.25, h*0.85);
  ctx.lineTo(w*0.25, h*0.25);
  ctx.lineTo(w*0.75, h*0.25);
  ctx.lineTo(w*0.75, h*0.85);
  ctx.lineTo(w*0.85, h*0.85);
  ctx.stroke();
  
  // Wave function inside well
  ctx.strokeStyle = '#f72585';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  const startX = w*0.25, endX = w*0.75;
  for (let x = startX; x <= endX; x += 2) {
    const normalized = (x-startX) / (endX-startX);
    const wave = Math.sin(n * Math.PI * normalized) * 70;
    const y = cy + 10 + wave;
    if (x === startX) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Probability |ψ|²
  ctx.fillStyle = 'rgba(0,180,216,0.2)';
  ctx.beginPath();
  for (let x = startX; x <= endX; x += 2) {
    const normalized = (x-startX) / (endX-startX);
    const prob = Math.sin(n * Math.PI * normalized);
    const probHeight = prob * prob * 80;
    const yTop = cy + 10 - probHeight;
    const yBot = cy + 10 + probHeight;
    if (x === startX) ctx.moveTo(x, yTop);
    ctx.lineTo(x, yBot);
  }
  ctx.closePath();
  ctx.fill();
  
  // Labels
  glowText(ctx, `n=${n} |ψ|² = 概率密度`, w*0.7, h*0.35, '#00b4d8', 11);
  glowText(ctx, '波函数 ψ', w*0.35, h*0.4, '#f72585', 11);
  glowText(ctx, '势阱', cx, h*0.9, '#8899aa', 11);
  glowText(ctx, '薛定谔方程: iℏ ∂ψ/∂t = Ĥψ', cx, h*0.12, '#00b4d8', 15);
}

function drawDirac(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  const cycle = t % 200; // 0-199 frame cycle
  
  // Phase: 0-40: photon flies in, 40-80: pair creation, 80-140: pair flies apart, 140-180: annihilation, 180-200: two photons out
  const phase = cycle < 40 ? 'incoming' : cycle < 80 ? 'creation' : cycle < 140 ? 'apart' : cycle < 180 ? 'annihilation' : 'photons';
  const prog = phase === 'incoming' ? cycle/40 : phase === 'creation' ? (cycle-40)/40 : phase === 'apart' ? (cycle-80)/60 : phase === 'annihilation' ? (cycle-140)/40 : (cycle-180)/20;
  
  // Background grid
  ctx.strokeStyle = 'rgba(136,153,170,0.06)';
  ctx.lineWidth = 0.5;
  for (let gx = 0; gx < w; gx += 30) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
  for (let gy = 0; gy < h; gy += 30) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }
  
  if (phase === 'incoming') {
    // High-energy gamma photon approaching
    const px = w*0.1 + prog * w*0.5;
    ctx.strokeStyle = '#f4a261';
    ctx.lineWidth = 2;
    ctx.shadowColor = '#f4a261';
    ctx.shadowBlur = 12;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    for (let i = -10; i <= 10; i += 3) {
      const wy = cy + i;
      const wx = px + Math.sin(i*0.5 + t*0.1) * 5;
      if (i === -10) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
    glowText(ctx, 'γ 高能光子 (E > 1.022 MeV)', px - 50, cy - 30, '#f4a261', 10);
  }
  
  if (phase === 'creation' || phase === 'apart' || phase === 'annihilation') {
    // Electron going left-down, positron going right-up
    const sep = phase === 'creation' ? 5 + prog * 40 : phase === 'apart' ? 45 + prog * 60 : 105 - prog * 60;
    
    // Electron e⁻ (blue, going left)
    const ex = cx - sep * 0.7;
    const ey = cy + sep * 0.5;
    ctx.fillStyle = '#00b4d8';
    ctx.shadowColor = '#00b4d8';
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(ex, ey, 8, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    glowText(ctx, 'e⁻ 电子', ex - 30, ey + 20, '#00b4d8', 10);
    
    // Positron e⁺ (pink, going right)
    const px2 = cx + sep * 0.7;
    const py2 = cy - sep * 0.5;
    ctx.fillStyle = '#f72585';
    ctx.shadowColor = '#f72585';
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(px2, py2, 8, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    glowText(ctx, 'e⁺ 正电子', px2 + 20, py2 - 15, '#f72585', 10);
    
    // Trajectory trails
    ctx.strokeStyle = 'rgba(0,180,216,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2,4]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(247,37,133,0.2)';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px2, py2); ctx.stroke();
    ctx.setLineDash([]);
  }
  
  if (phase === 'annihilation') {
    // Annihilation flash
    ctx.fillStyle = `rgba(244,162,97,${0.2 + prog*0.5})`;
    ctx.beginPath(); ctx.arc(cx, cy, 15 + prog*10, 0, Math.PI*2); ctx.fill();
  }
  
  if (phase === 'photons') {
    // Two photons flying out
    for (let i = 0; i < 2; i++) {
      const angle = i === 0 ? -0.5 : 0.5;
      const px3 = cx + prog * 80 * Math.cos(angle);
      const py3 = cy + prog * 80 * Math.sin(angle);
      ctx.strokeStyle = '#f4a261';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#f4a261';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      for (let j = -5; j <= 5; j += 2) {
        const wy2 = py3 + j * 4;
        const wx2 = px3 + Math.sin(j + t*0.2) * 4;
        if (j === -5) ctx.moveTo(wx2, wy2); else ctx.lineTo(wx2, wy2);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }
  
  // Energy formula
  const eqLabel = phase === 'creation' || phase === 'apart' ? 'E=mc²: 能量→物质!' : phase === 'annihilation' ? '物质→能量!' : '狄拉克方程预言反物质';
  glowText(ctx, eqLabel, cx, h*0.06, '#f4a261', 12);
  glowText(ctx, `狄拉克方程: (iγ^μ ∂_μ - m)ψ = 0`, cx, h*0.94, '#00b4d8', 12);
}

function drawQFT(ctx, w, h, t, st) {
  // Ocean of field with ripples
  const cx = w/2;
  const seaLevel = h*0.55;
  
  // Background sea
  ctx.fillStyle = 'rgba(0,180,216,0.05)';
  ctx.fillRect(0, seaLevel - 30, w, h - seaLevel + 30);
  
  // Field surface
  ctx.strokeStyle = '#00b4d8';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00b4d8';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  for (let x = 0; x < w; x += 2) {
    let y = seaLevel;
    // Multiple ripples
    y += Math.sin(x*0.02 + t*0.03) * 15;
    y += Math.sin(x*0.05 - t*0.04) * 8;
    y += Math.sin(x*0.08 + t*0.06) * 4;
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Excitations (particles)
  for (let i = 0; i < 5; i++) {
    const px = w*0.15 + i*w*0.18;
    const py = seaLevel + Math.sin(px*0.03 + t*0.04 + i)*15 - 20;
    const alpha = 0.3 + 0.7*(i/5);
    ctx.fillStyle = `rgba(247,37,133,${alpha})`;
    ctx.shadowColor = `rgba(247,37,133,${alpha})`;
    ctx.shadowBlur = 10*alpha;
    ctx.beginPath();
    ctx.arc(px, py, 5*alpha, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  glowText(ctx, '场是海洋，粒子是涟漪', cx, h*0.18, '#00b4d8', 16);
  glowText(ctx, '量子场论 (QFT)', cx, h*0.85, '#8899aa', 13);
}

function drawFeynman(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  const offset = (t % 200 < 100 ? t%100 : 100-(t%100)) * 0.3; // gentle pulse
  
  // Time arrow (bottom-left to top-right convention: time ↑)
  ctx.strokeStyle = 'rgba(136,153,170,0.2)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4,8]);
  ctx.beginPath(); ctx.moveTo(w*0.05, h*0.7); ctx.lineTo(w*0.05, h*0.3); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#8899aa';
  ctx.font = '9px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('时间 →', w*0.05, h*0.25);
  
  // Incoming electrons (left side): top-left and bottom-left
  // Outgoing electrons (right side): top-right and bottom-right
  const vx = cx; // vertex x
  const vty = cy - 35; // top vertex y
  const vby = cy + 35; // bottom vertex y
  
  // Top electron: in from top-left, out to top-right (scattered)
  ctx.strokeStyle = '#00b4d8';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00b4d8';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(w*0.15, vty - 30); ctx.lineTo(vx, vty); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vx, vty); ctx.lineTo(w*0.85, vty + 30); ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Bottom electron: in from bottom-left, out to bottom-right (scattered)
  ctx.beginPath(); ctx.moveTo(w*0.15, vby + 30); ctx.lineTo(vx, vby); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vx, vby); ctx.lineTo(w*0.85, vby - 30); ctx.stroke();
  
  // Virtual photon exchange (wavy line between vertices)
  const nWaves = 5;
  ctx.strokeStyle = '#f4a261';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#f4a261';
  ctx.shadowBlur = 8 + offset * 3;
  ctx.beginPath();
  for (let i = 0; i <= nWaves; i++) {
    const frac = i / nWaves;
    const y = vty + frac * (vby - vty);
    const x = vx + Math.sin(frac * Math.PI * 3 + t*0.08) * (12 + offset * 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
  
  // Vertex dots
  ctx.fillStyle = '#f4a261';
  ctx.beginPath(); ctx.arc(vx, vty, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(vx, vby, 4, 0, Math.PI*2); ctx.fill();
  
  // Labels
  glowText(ctx, 'e⁻', w*0.12, vty - 36, '#00b4d8', 11);
  glowText(ctx, 'e⁻', w*0.12, vby + 42, '#00b4d8', 11);
  glowText(ctx, 'e⁻', w*0.88, vty + 36, '#00b4d8', 11);
  glowText(ctx, 'e⁻', w*0.88, vby - 24, '#00b4d8', 11);
  
  // Virtual photon label
  glowText(ctx, '虚光子 γ', vx + 25, (vty+vby)/2, '#f4a261', 10);
  
  glowText(ctx, 'Møller散射: e⁻e⁻ → e⁻e⁻ (交换虚光子)', cx, h*0.92, '#8899aa', 12);
  glowText(ctx, '费曼图 — 每个图对应一个精确的量子振幅计算', cx, h*0.06, '#00b4d8', 12);
}

function drawStandard(ctx, w, h, t, st) {
  const cx = w/2;
  const cols = 4;
  const cellW = w / (cols + 1);
  const cellH = 50;
  const startY = h*0.12;
  
  const particles = [
    ['u','c','t','g'],
    ['d','s','b','γ'],
    ['e','μ','τ','Z'],
    ['νₑ','ν_μ','ν_τ','W'],
    ['','','','H']
  ];
  const names = [
    ['上夸克','粲夸克','顶夸克','胶子'],
    ['下夸克','奇夸克','底夸克','光子'],
    ['电子','μ子','τ子','Z玻色子'],
    ['电中微子','μ中微子','τ中微子','W玻色子'],
    ['','','','希格斯']
  ];
  const types = [
    ['q','q','q','g'],
    ['q','q','q','g'],
    ['l','l','l','g'],
    ['l','l','l','g'],
    ['','','','h']
  ];
  
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 4; col++) {
      if (row === 4 && col < 3) continue;
      const x = (col + 1) * cellW;
      const y = startY + row * (cellH + 8);
      const type = types[row][col];
      
      let bgColor = 'rgba(0,180,216,0.1)';
      if (type === 'q') bgColor = 'rgba(247,37,133,0.1)';
      else if (type === 'l') bgColor = 'rgba(0,180,216,0.08)';
      else if (type === 'g') bgColor = 'rgba(244,162,97,0.1)';
      else if (type === 'h') bgColor = 'rgba(114,9,183,0.15)';
      
      ctx.fillStyle = bgColor;
      ctx.strokeStyle = 'rgba(0,180,216,0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x - cellW*0.4, y - cellH*0.35, cellW*0.8, cellH*0.8, 6);
      ctx.fill();
      ctx.stroke();
      
      ctx.fillStyle = '#e0e8f0';
      ctx.font = 'bold 14px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(particles[row][col], x, y - 3);
      
      ctx.fillStyle = '#8899aa';
      ctx.font = '9px system-ui';
      ctx.fillText(names[row][col], x, y + 14);
    }
  }
  
  // Category labels
  ctx.fillStyle = '#f72585';
  ctx.font = '10px system-ui';
  ctx.textAlign = 'right';
  ctx.fillText('夸克', w*0.08, startY + cellH*0.6);
  ctx.fillText('轻子', w*0.08, startY + 2*cellH + cellH*0.6);
  
  ctx.fillStyle = '#f4a261';
  ctx.fillText('玻色子', w*0.08, startY + 3*cellH + cellH*0.6);
  
  glowText(ctx, '标准模型 — 17种基本粒子', cx, h*0.03, '#00b4d8', 15);
  glowText(ctx, '6夸克 + 6轻子 + 4力载体 + 1希格斯', cx, h*0.92, '#8899aa', 12);
}

function drawHiggs(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  
  // Higgs field — background "molasses"
  for (let i = 0; i < 60; i++) {
    const mx = (i*37 + t*0.3) % w;
    const my = (i*53 + t*0.2) % h;
    ctx.fillStyle = 'rgba(114,9,183,0.08)';
    ctx.beginPath();
    ctx.arc(mx, my, 2, 0, Math.PI*2);
    ctx.fill();
  }
  
  // Particles moving through
  // Photon — zips through (no coupling)
  const phx = (t*1.2 % w);
  ctx.fillStyle = '#f4a261';
  ctx.shadowColor = '#f4a261';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(phx, h*0.25, 5, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  glowText(ctx, '光子 (无质量)', phx + 40, h*0.22, '#f4a261', 9);
  
  // Electron — dragged (some coupling)
  const ex = (t*0.4 % w);
  const ey = h*0.55 + Math.sin(t*0.1)*5;
  ctx.fillStyle = '#00b4d8';
  ctx.shadowColor = '#00b4d8';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(ex, ey, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  glowText(ctx, '电子 (有质量)', ex + 40, ey - 10, '#00b4d8', 9);
  
  // Top quark — heavily dragged
  const tx = (t*0.15 % w);
  const ty = h*0.78 + Math.sin(t*0.05)*3;
  ctx.fillStyle = '#f72585';
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(tx, ty, 8, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  glowText(ctx, '顶夸克 (很重)', tx + 45, ty - 10, '#f72585', 9);
  
  glowText(ctx, '希格斯场像糖浆——不同粒子穿过时受到的"阻力"不同', cx, h*0.08, '#7209b7', 14);
  glowText(ctx, '阻力 = 质量', cx, h*0.92, '#8899aa', 13);
}

function drawEntanglement(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  
  // Two entangled particles
  const p1x = w*0.2;
  const p2x = w*0.8;
  const py = cy;
  
  // Connection
  const dashOffset = t*0.5 % 20;
  ctx.strokeStyle = 'rgba(247,37,133,0.3)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 4]);
  ctx.lineDashOffset = -dashOffset;
  ctx.beginPath();
  ctx.moveTo(p1x + 20, py);
  ctx.quadraticCurveTo(cx, py + 80, p2x - 20, py);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // Particle 1
  const p1Spin = Math.sin(t*0.06) > 0 ? '↑' : '↓';
  ctx.fillStyle = '#00b4d8';
  ctx.shadowColor = '#00b4d8';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(p1x, py, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '14px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(p1Spin, p1x, py + 5);
  glowText(ctx, '粒子A', p1x, py + 35, '#00b4d8', 11);
  
  // Particle 2
  const p2Spin = p1Spin === '↑' ? '↓' : '↑';
  ctx.fillStyle = '#f72585';
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(p2x, py, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '14px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(p2Spin, p2x, py + 5);
  glowText(ctx, '粒子B', p2x, py + 35, '#f72585', 11);
  
  glowText(ctx, '一个 ↑ → 另一个必定 ↓', cx, h*0.82, '#f72585', 14);
  glowText(ctx, '不管隔多远——这是量子纠缠', cx, h*0.9, '#8899aa', 13);
}

function drawQCD(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  
  // Three quarks in a proton
  const colors = ['#ff4444', '#44ff44', '#4444ff'];
  const positions = [
    { x: cx - 20 + Math.sin(t*0.03)*10, y: cy - 25 + Math.cos(t*0.04)*8 },
    { x: cx + 30 + Math.cos(t*0.035)*8, y: cy - 20 + Math.sin(t*0.05)*10 },
    { x: cx + 5 + Math.sin(t*0.04)*12, y: cy + 25 + Math.cos(t*0.03)*8 }
  ];
  
  // Glue springs between quarks
  positions.forEach((p, i) => {
    const next = positions[(i+1)%3];
    ctx.strokeStyle = `rgba(244,162,97,0.4)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    const tx = (p.x + next.x)/2, ty = (p.y + next.y)/2;
    ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(tx + Math.sin(t*0.06+i)*15, ty + Math.cos(t*0.06+i)*15, next.x, next.y);
    ctx.stroke();
  });
  
  // Quarks
  positions.forEach((p, i) => {
    ctx.fillStyle = colors[i];
    ctx.shadowColor = colors[i];
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  
  // Rubber band analogy
  const pullX = cx;
  const pullY = cy - 90;
  ctx.strokeStyle = '#f4a261';
  ctx.lineWidth = 1;
  ctx.setLineDash([3,5]);
  ctx.beginPath();
  ctx.moveTo(pullX, pullY);
  ctx.lineTo(positions[0].x, positions[0].y);
  ctx.stroke();
  ctx.setLineDash([]);
  
  ctx.fillStyle = 'rgba(244,162,97,0.2)';
  ctx.beginPath();
  ctx.arc(pullX, pullY, 12, 0, Math.PI*2);
  ctx.fill();
  
  glowText(ctx, '越拉越紧！', pullX + 30, pullY - 10, '#f4a261', 9);
  glowText(ctx, '质子 (uud)', cx, h*0.82, '#00b4d8', 13);
  glowText(ctx, '夸克禁闭——永远看不到自由的夸克', cx, h*0.9, '#8899aa', 12);
}

function drawString(ctx, w, h, t, st) {
  const cx = w/2;
  const mode = st?.mode || 1;
  const amplitude = st?.amplitude || 20;
  
  // A single string vibrating in different modes
  const nModes = 3;
  const modeSpacing = h*0.5 / nModes;
  
  for (let m = 0; m < nModes; m++) {
    const stringY = h*0.2 + m * modeSpacing + modeSpacing/2;
    const thisAmp = amplitude - m*5;
    const thisFreq = m + 1;
    const active = (m+1 === mode);
    
    ctx.strokeStyle = active ? '#f72585' : m === 0 ? 'rgba(0,180,216,0.5)' : 'rgba(136,153,170,0.4)';
    ctx.lineWidth = active ? 3 : 1.5;
    if (active) { ctx.shadowColor = '#f72585'; ctx.shadowBlur = 10; }
    ctx.beginPath();
    
    const freq = m + 1;
    for (let x = w*0.15; x <= w*0.85; x += 2) {
      const normalized = (x - w*0.15) / (w*0.7);
      const y = stringY + Math.sin(normalized * freq * Math.PI + t*0.04) * thisAmp;
      if (x === w*0.15) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Labels
    ctx.fillStyle = ctx.strokeStyle;
    ctx.font = '11px system-ui';
    ctx.textAlign = 'right';
    const labels = ['电子', 'μ子', '顶夸克'];
    ctx.fillText(labels[m], w*0.12, stringY + 4);
  }
  
  glowText(ctx, '一根弦，三种振动 = 三种粒子', cx, h*0.08, '#00b4d8', 15);
  glowText(ctx, '弦论: 所有粒子是同一根弦的不同"音符"', cx, h*0.92, '#8899aa', 12);
}

function drawQC(ctx, w, h, t, st) {
  const cx = w/2, cy = h/2;
  const theta = st?.theta || Math.PI/4;
  const phi = st?.phi || 0;
  
  // Bloch sphere
  ctx.strokeStyle = 'rgba(136,153,170,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, 80, 25, 0, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy-80); ctx.lineTo(cx, cy+80); ctx.stroke();
  
  // State vector
  const r = 75;
  const sx = cx + r * Math.sin(theta) * Math.cos(phi);
  const sy = cy - r * Math.cos(theta);
  const sz = r * Math.sin(theta) * Math.sin(phi);
  
  ctx.strokeStyle = '#f72585';
  ctx.lineWidth = 2.5;
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sx, sy - sz*0.2); ctx.stroke();
  ctx.shadowBlur = 0;
  
  ctx.fillStyle = '#f72585';
  ctx.beginPath(); ctx.arc(sx, sy - sz*0.2, 7, 0, Math.PI*2); ctx.fill();
  
  ctx.fillStyle = '#00b4d8';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('|0⟩', cx, cy - 92);
  ctx.fillText('|1⟩', cx, cy + 100);
  
  const a0 = Math.cos(theta/2);
  const a1 = Math.sin(theta/2) * (Math.cos(phi) + (Math.sin(phi)>0?'+':'') + Math.sin(phi).toFixed(2)+'i');
  glowText(ctx, `|ψ⟩ = ${a0.toFixed(2)}|0⟩ + ${Math.sin(theta/2).toFixed(2)}e^${phi.toFixed(1)}i|1⟩`, cx, h*0.88, '#f72585', 12);
  glowText(ctx, '布洛赫球 — 拖拽旋转 | 量子门操作', cx, h*0.06, '#00b4d8', 12);
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let found = false;
  document.querySelectorAll('.concept-card').forEach(card => {
    const title = (card.dataset.title || '').toLowerCase();
    const desc = (card.dataset.desc || '').toLowerCase();
    const match = !q || title.includes(q) || desc.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) found = true;
  });
  document.getElementById('noResults').style.display = found ? 'none' : 'block';
}
