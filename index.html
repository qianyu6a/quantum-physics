let translations = {"planck": {"problem": "In 1900, physics basked in optimism — Lord Kelvin had declared the edifice of physics complete, with only \"two clouds\" remaining. One of them was blackbody radiation: why does a heated piece of iron glow red first, then white? Classical theory predicted an energy distribution that diverged to infinity in the ultraviolet — the famous \"ultraviolet catastrophe.\" Max Planck, a conservative 42-year-old German physicist, spent six years trying to solve the problem with classical thermodynamics, hitting wall after wall. Finally he made an assumption that even he himself considered an act of \"desperation.\"", "insight": "On October 7, 1900, in desperation, Planck assumed that matter emits and absorbs radiation not continuously but in discrete \"quanta,\" with a minimum unit E = hν. The constant h would become the cornerstone of all of quantum mechanics. But Planck himself called it a \"purely formal assumption\" and spent years afterward trying to eliminate it by returning to classical physics — failing every time. He later recalled: \"My futile attempts... made me increasingly convinced that the quantum of action plays a fundamental role in atomic physics.\" That day is now universally recognized as the birthday of quantum physics.", "bigpic": "Energy is like a staircase: you cannot stand on half a step. In everyday life energy appears continuous only because h is so small that the steps are imperceptibly fine. But from that day on, physics was split in two — the classical world and the quantum world. Planck opened a door that he himself was afraid to walk through, yet his 1918 Nobel Prize marked humanity's first step toward re-understanding the fundamental rules of the universe. His reluctant quantum, meant as a mathematical trick, turned out to be the deepest discovery of the age — a reminder that nature's truths are often found where we least expect them."}, "photoelectric": {"problem": "In 1887, Hertz accidentally discovered while experimenting with electromagnetic waves that ultraviolet light striking metal knocks out electrons. Stranger still, whether electrons are emitted depends on the color of the light, not its brightness — no matter how bright, red light fails; even feeble violet light succeeds. Classical wave theory held that brighter light carries more energy, so this phenomenon defied all explanation. In 1905, a 26-year-old clerk at the Swiss patent office wrote four world-changing papers in his spare time — one of them solved the photoelectric effect.", "insight": "Einstein proposed a bold idea: light is not a continuous wave but a stream of discrete \"light quanta\" (later called photons), each carrying energy E = hν. To escape the metal surface, an electron needs a photon powerful enough — which depends on frequency, not brightness. Too low a frequency and no amount of intensity helps; high enough a frequency and even the faintest light ejects electrons. The drama: American physicist Millikan spent a full decade running experiments determined to refute Einstein — only to have his own data perfectly confirm the theory. Millikan admitted in his paper that \"Einstein's photoelectric equation is exact\" — and then both men won Nobel Prizes.", "bigpic": "It is like throwing ping-pong balls at a window: ten thousand will not break it, but a single bullet will. E = hν means frequency determines the power of a single photon. This paper, together with special relativity and Brownian motion, earned Einstein's \"miracle year\" its name. The photoelectric effect not only confirmed light's particle nature but forced physicists to accept the bizarre notion of the \"quantum\" — is light a wave or a particle? The answer turned out to be \"both.\" That contradiction gave birth to wave-particle duality."}, "bohr": {"problem": "In 1911, Rutherford bombarded gold foil with alpha particles and discovered that atoms contain a tiny but extremely heavy nucleus. According to classical electromagnetism, an electron orbiting a nucleus should continuously radiate energy and spiral into the nucleus within less than a microsecond — yet atoms are stable. The world, by that logic, should not exist. Rutherford's discovery had demolished the plum-pudding atom, but no one could explain how atoms survived at all. The young Danish physicist Niels Bohr visited Rutherford's laboratory, saw this contradiction, and had a flash of insight.", "insight": "In 1913 Bohr made a \"hybrid monster\" of an assumption: electrons can occupy only specific \"allowed orbits,\" radiating no energy while there; only when an electron \"jumps\" from one orbit to another does it absorb or emit a single photon. This let every spectral line of hydrogen be computed exactly — matching experiment to a stunning degree. The Bohr model was \"half-classical, half-quantum\": the orbits are classical, the transitions are quantum. Bohr later became the \"godfather\" of Copenhagen quantum mechanics, and his institute attracted a generation of geniuses including Heisenberg and Pauli.", "bigpic": "Electrons live in an apartment building — floors 1, 2, 3, but no floor 1.5. Transitions are instantaneous, with no intermediate stops. The Bohr model explained why each element has a unique \"fingerprint\" of spectral lines, giving chemistry a physical foundation. Although it was later superseded by quantum mechanics, the picture of electrons jumping between orbits remains our most intuitive image of the atom, and it still appears in textbooks and logos around the world. Every fireworks display and neon sign is quantum transitions made visible."}, "debroglie": {"problem": "In 1923, a young man from a French aristocratic family submitted a doctoral thesis — he had originally studied history and switched fields because he found physics \"more fun.\" In that thesis, Louis de Broglie posed a question that seemed nearly absurd at the time: since light (a wave) had been shown to possess particle properties, why could electrons (particles) not possess wave properties? This was no idle fancy but a deep conviction about symmetry — nature would not grant wave-particle duality to light alone.", "insight": "De Broglie produced an extraordinarily simple formula: λ = h/p — every particle's wavelength equals Planck's constant divided by its momentum. Your own wavelength is about 10⁻³⁶ meters, a trillion times smaller than a nucleus. But an electron's wavelength is comparable to atomic spacings — which explains why Bohr's orbits must be special: only orbits that fit a whole number of wavelengths are stable. The review committee found the idea so crazy that they consulted Einstein, who said: \"He has lifted a corner of the great veil.\" In 1927, experiments confirmed that electrons do produce interference patterns — de Broglie won the 1929 Nobel Prize for a single doctoral thesis, an unprecedented feat.", "bigpic": "If electrons are waves, what about protons and neutrons? — They are too. If all matter is wavelike, then the entire world is, in essence, a symphony of waves. A particle in space is not a point but a diffuse cloud of probability. This idea directly gave birth to Schrödinger's wave mechanics. Where point particles ended, wave mechanics began — and with it, a new picture of reality. De Broglie's genius lay not in discovering a new phenomenon but in extending a known principle to all matter — the highest form of theoretical physics."}, "uncertainty": {"problem": "In the winter of 1927, in Copenhagen, the 25-year-old Werner Heisenberg paced a park alone late into the night. He was wrestling with a question: to observe an electron in quantum theory, you must \"illuminate\" it with a photon — but the photon's collision changes the electron's velocity. The harder you try to pin down its position, the more you disturb its speed. Was this merely a limitation of measurement technique, or something more fundamental? Heisenberg realized it went deeper than he had thought.", "insight": "Heisenberg's conclusion was earth-shattering: uncertainty exists not because our measurements are inadequate, but because particles simply have no \"definite position and velocity\" to begin with. Δx·Δp ≥ ℏ/2 is a hard law of nature, not a technical problem. Einstein hated it; his famous retort \"God does not play dice\" was aimed squarely at this probabilistic picture. Bohr later upgraded it into the complementarity principle — position and momentum are complementary; knowing one means losing the other. At the 1927 Solvay Conference the two men staged the most brilliant philosophical debate in the history of physics: each time Einstein designed a thought experiment to refute the uncertainty principle, Bohr rebutted him using Einstein's own general relativity.", "bigpic": "It is like photography: the faster the shutter, the greater the motion blur. But the uncertainty principle does not say \"we do not know\" — it says \"nature itself only promises a probability distribution.\" Asking \"where exactly is the electron?\" before measuring is meaningless in quantum mechanics — it is not hidden; it simply has not been decided yet. The same logic applies to energy and time, and even to a particle's spin measured along different axes. This philosophical shock may be even greater than the physics itself."}, "schrodinger": {"problem": "In 1925 Heisenberg invented \"matrix mechanics\" to describe quantum phenomena, but it was full of abstract, forbidding matrix algebra that most physicists could not follow. The next year, Austria's Erwin Schrödinger, inspired by de Broglie's wave-particle duality, sought a more intuitive mathematical language. Legend has it he took a holiday in the Alps with his mistress, and returned from the mountains having written down the famous equation that would bear his name. The two formulations looked utterly different, and physicists wondered which — if either — was the true language of nature.", "insight": "The Schrödinger equation iℏ ∂ψ/∂t = Ĥψ is the \"second law of Newton\" of quantum mechanics — it describes how a quantum state evolves in time. Its protagonist is the wave function ψ: invisible and intangible itself, yet |ψ|² tells you the probability of finding the particle at a given position. Schrödinger used it to compute all of hydrogen's energy levels exactly — identical to Heisenberg's matrix mechanics results, but far more elegant. The irony: Schrödinger later became an \"opponent\" of quantum mechanics! His famous thought experiment — Schrödinger's cat, simultaneously dead and alive — was meant to mock the theory's absurdity, yet it became the theory's most famous metaphor instead.", "bigpic": "Newtonian mechanics tells you: the ball will be at (x, y, z) in one second. Quantum mechanics says: the probability that the ball is at (x, y, z) in one second is 63%. Not because we do not know — nature itself only promises probabilities. The Schrödinger equation is breathtakingly elegant, but its philosophical meaning remains the deepest riddle in physics. Science's job, Schrödinger insisted, is to describe what we can observe; whether a deeper \"real\" world exists beneath the probabilities is a question physics may never answer. The cat that is both dead and alive has become the pop-culture synonym for \"quantum.\""}, "dirac": {"problem": "In 1928 Paul Dirac faced a daunting challenge: the Schrödinger equation is incompatible with special relativity. For an electron moving near the speed of light, the Schrödinger equation gives wrong results. For years, physicists had treated this as a hopeless demand, yet Dirac refused to settle for an approximation. He wanted a single equation satisfying both quantum mechanics and relativity — like demanding one sentence that rhymes, scans, and observes tonal rules at once; physically, it seemed nearly impossible. Most theorists accepted the limitation; Dirac refused.", "insight": "Dirac succeeded. He wrote down an equation of breathtaking beauty. But its solutions were strange: half of them corresponded to \"negative energy,\" which seemed physically meaningless. Every other physicist wanted to throw those solutions away. Dirac said: wait — this is not a bug, it is a prediction. He proposed the existence of an antiparticle with the same mass as the electron but opposite charge — the positron. In 1932, Carl Anderson really found positrons in cosmic-ray experiments. An equation predicted something never observed, and it was then found in the laboratory — the highest glory of theoretical physics.", "bigpic": "The Dirac equation is like a mirror: every particle has an antiparticle. Electron ↔ positron, proton ↔ antiproton. When they meet, 100% of their mass converts into energy — the ultimate realization of E=mc². The significance transcends physics: it proves that mathematical beauty can guide us to physical truth. Dirac said: \"It is more important to have beauty in one's equations than to have them fit experiment.\" Yang Chen-Ning later remarked that Dirac's papers are \"autumn waters unstained by dust.\""}, "qft": {"problem": "In the 1930s, physicists trying to describe the electromagnetic field with quantum mechanics ran into enormous trouble: according to the theory, the vacuum constantly creates and annihilates pairs of virtual particles, causing the calculated self-energy of the electron to diverge to infinity. Every attempt to compute even the simplest observable collapsed into meaningless infinities, and for a while the whole program seemed hopeless. This problem nearly killed quantum field theory in its cradle. After World War II, three geniuses almost simultaneously found the solution — they cleverly \"hid\" the infinities.", "insight": "Quantum field theory's revolutionary perspective: the field is fundamental; particles are merely ripples of fields. Your electron and an electron on the Moon are different waves of the same \"electron field.\" Like ripples on a lake — you never see independent \"chunks of water,\" only the motion of water itself. Feynman invented diagrammatic methods, Schwinger excelled at mathematical derivation, and Tomonaga independently completed the Japanese version — three men, three paths, one destination: \"renormalization.\" The result: the theoretical value of the electron's magnetic moment matches experiment to 12 decimal places — an accuracy equivalent to measuring Earth's diameter with an error no greater than a hair's width.", "bigpic": "Quantum field theory tells us the vacuum is not empty — it is the ground state of all fields, where virtual particles constantly \"borrow energy\" to appear and annihilate within fleeting instants. Every breath you take contains photons being created and destroyed within it. QFT's success has been so overwhelming that it became the foundational framework of all modern particle physics. The Standard Model is one concrete realization of QFT. The lesson of QFT is that \"emptiness\" is a myth — the universe is seething activity at every scale, and out of that activity, all particles and forces are born."}, "feynman": {"problem": "Theoretical calculations in quantum electrodynamics involve infinitely many possible intermediate processes. To compute what happens when two electrons collide, you must consider exchanges of one photon, two photons, three — and each intermediate process corresponds to an integral so complex it drove physicists to despair. In the 1940s, Richard Feynman sat in a bar at Cornell University and drew a pictorial language on cocktail napkins. His radical idea: replace the sea of algebra with simple pictures that any physicist could read at a glance.", "insight": "The core insight of Feynman diagrams: each diagram corresponds to one precise mathematical expression. Straight lines represent electrons, wavy lines represent photons, vertices represent interactions. Draw a diagram, write the expression by the rules, integrate — and you get the probability of that process occurring. When two light beams meet, photons do not couple directly, but they can interact indirectly through \"virtual\" electron-positron pairs — a photon becomes a virtual pair, and the pair turns back into a photon. This is \"light scattering,\" impossible in classical physics, and in QED its probability is tiny but nonzero — Feynman diagrams predicted the effect precisely, and experiments later confirmed it.", "bigpic": "QED's predicted value of the electron's magnetic moment agrees with measurement to twelve decimal places — the most precise achievement of human intellect ever recorded. Decades later, Feynman could still be found explaining physics to friends on a Brazilian beach, calculation paper in one hand and a drink in the other, sketching Feynman diagrams in the sand. He once said: I do not care about the Nobel Prize; what I care about is this interesting world. His diagrams turned the most abstruse mathematics in physics into something a student could learn in an afternoon — perhaps the greatest teaching tool in the history of science."}, "standard": {"problem": "In the 1960s, particle accelerators popped out supposedly \"fundamental\" particles like popcorn — pions, kaons, baryons of every kind... The particle count exceeded 100, and physicists began to wonder: are they really \"fundamental\"? It was like discovering a hundred-plus kinds of \"basic elements\" — you inevitably suspect that something fewer must lie beneath. The confusion was so complete that the field was sometimes called a \"particle zoo,\" with no organizing principle in sight. In 1964, Murray Gell-Mann and George Zweig independently proposed that all hadrons are made of more fundamental \"quarks.\"", "insight": "Gell-Mann borrowed the name \"quark\" from James Joyce's novel Finnegans Wake (the cry of gulls in the book). Arranging the known particles by symmetry, he discovered a beautiful geometric pattern — the \"Eightfold Way.\" Just as Mendeleev's periodic table predicted unknown elements, the quark model predicted the Ω⁻ particle — discovered in 1964 with uncanny precision. The Standard Model ultimately fixed 17 fundamental particles: 6 quarks + 6 leptons + 4 force carriers + 1 Higgs. Every subsequently predicted particle — the charm quark, the W/Z bosons, the top quark, the Higgs — was found by experiment, the last confirmed being the Higgs in 2012.", "bigpic": "The Standard Model is physics' periodic table — it explains every known force and form of matter except gravity. But it is not perfect: it says nothing about dark matter or dark energy, and neutrino masses were bolted on as an afterthought. It is a magnificent palace, yet outside its windows a larger universe is knocking at the door, and most physicists suspect that the next revolution lies just beyond it. For all its triumphs, it remains a provisional chapter — physicists know it is not the final word, only the best one we have."}, "higgs": {"problem": "In 1964 Peter Higgs wrote a paper predicting a new particle — one that could give other particles mass. He submitted it to Physics Letters, where the editor rejected it as having \"no obvious relevance to physics.\" Angrily, Higgs added a passage emphasizing detectability and resubmitted to Physical Review Letters, where it passed. The rejection was a stroke of irony: the idea that would one day complete the Standard Model almost never saw the light of day. And he did not know that two other groups of physicists had independently proposed almost the same mechanism.", "insight": "The Higgs mechanism says: the entire universe is immersed in an invisible \"field\" — the Higgs field. Different particles encounter different \"drag\" as they move through it — and that is the origin of mass. Photons do not couple to the Higgs field, so they are massless. The top quark couples most strongly, weighing 173 GeV. The W and Z bosons gain mass through coupling, perfectly verifying the theory. On July 4, 2012, CERN announced the discovery of the Higgs boson. The 83-year-old Higgs wept at the announcement: \"I never thought I would see this day in my lifetime.\" He had waited 48 years.", "bigpic": "In 2013, Higgs and Englert shared the Nobel Prize. That day Higgs \"strategically\" left home and went to a pub to drink beer, dodging the press — he loathed the spotlight all his life. The Higgs mechanism filled the last piece of the Standard Model puzzle, teaching us that the essence of mass is not how \"heavy\" a thing is, but how strongly it interacts with the Higgs field. Mass, in other words, is a property of relationship, not of substance."}, "entanglement": {"problem": "In 1935, Einstein and two young colleagues published a paper intended to deliver quantum mechanics its \"death sentence.\" They devised the EPR paradox: two entangled particles, once separated, instantly reveal each other's state when one is measured — violating relativity's rule that information cannot travel faster than light. Einstein called it \"spooky action at a distance\" and insisted that quantum mechanics was incomplete. Everyone assumed Einstein was right — he was Einstein, after all. Until 1964, when an Irish physicist named John Bell decided to put it to the test.", "insight": "Bell originally sided with Einstein, hoping to prove quantum mechanics wrong. He derived an inequality: if hidden variables exist, experimental results must satisfy it. Then he found that quantum mechanics' predictions violate this inequality. The implication: either accept faster-than-light effects, or accept that particles truly have no definite values before measurement. In 1982, French physicist Alain Aspect performed a flawless experiment — the Bell inequality was decisively violated. Einstein was wrong. Quantum entanglement is genuinely \"spooky.\" Decades of subsequent experiments, including loophole-free tests, have only sharpened the conclusion: nature really is this strange.", "bigpic": "It is not that they conspired in advance — it is that they never had independent existence. Entangled particles share a single wave function, like a torn sheet of paper: you get two pieces, but they were once one. Quantum entanglement has now become the core resource of quantum communication and quantum computing. Bell ended the greatest philosophical debate in physics history with a single inequality. Einstein was wrong on this point, yet his questioning spirit drove all of physics forward."}, "qcd": {"problem": "In the 1970s the quark model was a great success, but one maddening problem remained: nobody had ever seen a free quark. No matter how you smash protons, isolated quarks never fly out. David Gross, Frank Wilczek, and David Politzer discovered a counterintuitive phenomenon: the strong force behaves exactly opposite to electromagnetism — the closer quarks are, the weaker the force; the farther apart, the stronger! For years the puzzle sat unresolved, undermining the quark model's credibility even as its predictions kept coming true.", "insight": "The discovery is called \"asymptotic freedom\" — at extremely close range quarks behave almost like free particles, but pull them apart and the force tightens like a rubber band, until the energy is enough to \"yank\" a new quark-antiquark pair out of the vacuum. The result: you can never observe a lone quark — this is \"quark confinement.\" The three shared the 2004 Nobel Prize. A proton is a dynamic system of three quarks bound by gluon springs, and 98% of its mass comes from the gluons' binding energy — E=mc² means the trapped, light-speed particles store enormous energy.", "bigpic": "QCD explains why the proton's mass is far greater than the sum of its three quarks' masses. Your body's weight comes mainly from the elastic potential energy of gluons inside the protons and neutrons within you. We are all energy structures bound together by quantum rubber bands. This beautiful, mad theory perfectly describes the strongest force in the universe — the strong interaction. And beneath it all lies a mystery still unsolved: why the force behaves this way at all."}, "string": {"problem": "In the late 1960s, physicists found a strange formula that perfectly described the behavior of certain hadrons. In 1970, Yōichirō Nambu and others realized — this formula describes not particles, but vibrating strings! String theory began as a theory of the strong interaction, but was quickly superseded by QCD. Yet some physicists noticed that the equations hid a massless particle of spin 2 — precisely the property of the graviton. Most dismissed the observation as a curiosity — after all, hadrons were not gravitons.", "insight": "String theory's core idea: fundamental particles are not points but unimaginably tiny strings. Different vibration modes correspond to different particles — just as different vibrations of a guitar string produce different notes. The miracle: gravity emerges from the equations automatically. No extra assumptions needed — gravitation simply falls out of string theory. But the price is steep: strings require 10-dimensional spacetime, roughly 10⁵⁰⁰ possible vacuum solutions, and so far zero experimental evidence. It remains the only known framework in which gravity and quantum mechanics coexist consistently, which is why so many brilliant minds have devoted their careers to it.", "bigpic": "String theory is breathtakingly beautiful — and possibly wrong. It is frontier exploration driven purely by mathematical aesthetics. Critics say it is not science (no falsifiable predictions); supporters say our telescopes are simply not big enough yet. But string theory has already contributed mathematical tools that transformed physics — right or wrong, it has changed the way we think about the universe, and ideas like holography and extra dimensions now permeate mainstream research. Whether or not strings exist, the search for them has already reshaped mathematics itself — a remarkable legacy for a theory with no experiments."}, "quantum-computing": {"problem": "In 1981, Richard Feynman gave a famous lecture at MIT, pointing out a profound predicament: simulating quantum systems on a classical computer requires computational resources that grow exponentially with the number of particles — simulating 50 electrons needs 2^50 states, more than the age of the universe allows. Then he posed a bombshell question: what if the computer itself were quantum? \"Nature isn't classical, dammit — if you want to make a simulation of nature, you'd better make it quantum mechanical.\"", "insight": "Quantum computing's core is superposition: a classical bit is either 0 or 1, but a quantum bit can be a superposition of both simultaneously. N qubits can represent 2^N states at once — quantum gates operate on all possible states in a single step. Key algorithms include Shor's (breaking encryption) and Grover's (search speedup). But maintaining quantum coherence is brutally hard — environmental noise causes decoherence. We currently live in the \"noisy intermediate-scale quantum\" era. In 2019, Google claimed quantum supremacy — outperforming classical computers on a specific task.", "bigpic": "Quantum computing is not a faster computer — it is a fundamentally different computational paradigm, like the leap from abacus to electronic computer. With a fault-tolerant quantum computer: breaking existing encryption, designing new drugs, room-temperature superconductors — problems that would take the age of the universe could be solved in minutes. China's Jiuzhang and Zuchongzhi, Google's Sycamore and Willow, IBM's thousand-qubit roadmap — the whole world is racing. This may be the greatest technological revolution we will see in our lifetime."}};

function buildHomePage() {
  const grid = document.getElementById('cardsGrid');
  if (!grid) return;
  concepts.forEach(c => {
    const card = document.createElement('div');
    card.className = 'concept-card';
    card.dataset.title = c.title;
    card.dataset.desc = c.tagline;
    card.innerHTML = `<div class="card-icon">${c.icon}</div><div class="card-num">${c.year}</div><div class="card-title">${c.num}. ${c.title}</div><div class="card-desc">${c.tagline}</div>`;
    card.onclick = () => { activeId = c.id; showView('detail'); };
    grid.appendChild(card);
  });
  const timeline = document.getElementById('timeline');
  if (!timeline) return;
  const events = [
    {year:'1895', text:'伦琴发现X射线——人类第一次看到体内的骨骼。这不仅是一项医学革命，更标志着物理学开始深入原子世界。'},
    {year:'1900', text:'普朗克引入能量量子化概念，E=hν。"这是绝望之举"——他自己都不信。量子物理的诞生日。'},
    {year:'1905', text:'爱因斯坦奇迹年：光电效应、布朗运动、狭义相对论。26岁的专利局职员改写了物理学。'},
    {year:'1911-1913', text:'卢瑟福发现原子核，玻尔提出量子轨道模型。电子"住楼房"——只允许特定轨道。'},
    {year:'1924-1927', text:'量子力学的黄金时代：波粒二象性、不确定性原理、薛定谔方程。哥本哈根争论奠定量子哲学基础。'},
    {year:'1928-1932', text:'狄拉克方程统一量子力学和相对论，预言反物质。安德森发现正电子——数学之美被实验证实。'},
    {year:'1940s-1950s', text:'QED完成：费曼、施温格、朝永解决"无穷大"问题。人类最精确的物理理论诞生。'},
    {year:'1960s-1970s', text:'标准模型成形：夸克模型、电弱统一理论。所有预言粒子被逐一发现。'},
    {year:'1964-2012', text:'希格斯机制预言赋予万物质量的场。论文曾被拒，他等了48年。2012年CERN发布会，83岁的他哭了。'},
    {year:'1980s-1990s', text:'量子纠缠违反贝尔不等式——爱因斯坦错了。量子计算从费曼构想走向实验。'},
    {year:'2000s-2020s', text:'量子技术爆发：墨子号量子卫星、Google量子霸权、IBM千比特处理器。量子计算机走向现实。'}
  ];
  events.forEach(e => {
    const item = document.createElement('div');
    item.className = 'timeline-item';
    item.innerHTML = `<div class="timeline-year">${e.year}</div><div class="timeline-text">${e.text}</div>`;
    timeline.appendChild(item);
  });
}

function rebuildConcepts() {
  const tree = document.getElementById('tree');
  const content = document.getElementById('content');
  concepts.forEach(c => {
    const node = document.createElement('div');
    node.className = 'tree-node';
    node.innerHTML = `<div class="tree-label" data-id="${c.id}"><span class="icon">${c.icon}</span><span>${c.title}</span><span class="num">${c.num}</span></div>`;
    node.querySelector('.tree-label').onclick = () => showConcept(c.id);
    tree.appendChild(node);

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = `sec-${c.id}`;
    sec.innerHTML = `<div class="section-header"><div class="year">${c.year}</div><h2>${c.num}. ${c.title}</h2><div class="tagline">${c.tagline}</div></div><div class="tag-row"><span class="tag ${c.tag}">${c.tag === 'root' ? '基础概念' : '进阶理论'}</span></div><div class="callout accent"><strong>🤔 问题：</strong>${c.problem}</div><div class="concept-block"><h3>💡 关键洞察</h3><p>${c.insight}</p></div><div class="callout purple"><strong>🌌 大局观：</strong>${c.bigpic}</div><div class="canvas-container"><canvas id="${c.canvasId}"></canvas><div class="canvas-label">交互可视化</div><div class="canvas-hint">💡 点击/滑动 交互</div></div>`;
    content.appendChild(sec);
  });
}

document.addEventListener('DOMContentLoaded', () => { initLanguage(); buildHomePage(); });
</script>
